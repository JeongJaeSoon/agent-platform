name: Images

# Builds the three app images (apps/*/Dockerfile) on every pull request and
# main push, smokes the worker's bundled Claude Code executable, and records
# every digest as an artifact. Only a tag push publishes to ghcr.io: the
# digests from that run are what a release manifest pins (Obsidian
# deployment.md § 배포·승격·롤백). Registry CD beyond the push is D5.
#
# Every build also checks what the image ships against THIRD_PARTY_NOTICES.md
# and scans it for known vulnerabilities (94S-338). The `supply-chain` job is
# the verdict, a required check: a high or critical vulnerability with a fix
# available, in an image or anywhere in bun.lock, fails it; one without a fix
# is only reported (94S-363). A tag's release waits for the same verdict on
# the build and on the digest it promotes. The daily run turns a failed
# verdict into an issue (`vulnerability-report`).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# Read-only for every job but `publish`: a pull request can edit this file,
# so a token with package write in the PR job would let a branch publish
# images before merge. `publish` alone gets package write, and only runs
# on a tag.
permissions:
  contents: read

concurrency:
  group: images-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Lower-cased in the metadata step: ghcr rejects upper-case repository paths.
  IMAGE_PREFIX: ${{ github.repository }}
  # Pulled from the CI mirror, not Docker Hub (94S-317): the Dockerfiles'
  # own BUN_IMAGE by the same digest, so the image bytes do not change, the
  # BuildKit that setup-buildx-action runs, and the Dockerfile frontend.
  # ci-image-mirror.yml copies them; tests/ci-images.test.ts holds them to
  # that list and the Dockerfiles.
  BUN_IMAGE: ghcr.io/jeongjaesoon/agent-platform-ci/bun@sha256:b86c67b531d87b4db11470d9b2bd0c519b1976eee6fcd71634e73abfa6230d2e
  BUILDKIT_IMAGE: ghcr.io/jeongjaesoon/agent-platform-ci/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
  # The frontend the Dockerfiles' `# syntax=` line names, by the digest of
  # that tag; BUILDKIT_SYNTAX overrides the line, which BuildKit would
  # otherwise resolve on Docker Hub.
  DOCKERFILE_FRONTEND_IMAGE: ghcr.io/jeongjaesoon/agent-platform-ci/dockerfile@sha256:a57df69d0ea827fb7266491f2813635de6f17269be881f696fbfdf2d83dda33e

jobs:
  build:
    # Pinned rather than ubuntu-latest for the same reason as ci.yml.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [control-host, worker, egress-proxy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - id: meta
        name: Image name and tags
        env:
          APP: ${{ matrix.app }}
          PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          name="${REGISTRY}/$(echo "$PREFIX" | tr '[:upper:]' '[:lower:]')-${APP}"
          echo "name=${name}" >>"$GITHUB_OUTPUT"
          echo "tags=${name}:sha-${GITHUB_SHA::12}" >>"$GITHUB_OUTPUT"
          # The Dockerfiles' APT_UPGRADE_KEY (94S-363): a new day misses the
          # cached `apt-get upgrade` layer, so the daily run scans that day's
          # Debian fixes rather than the first build's.
          echo "apt-upgrade-key=$(date -u +%F)" >>"$GITHUB_OUTPUT"

      # `load` puts the image in the runner's daemon for the smoke below.
      # Nothing is pushed from this job; see `publish`.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          load: true
          push: false
          provenance: false
          cache-from: type=gha,scope=images-${{ matrix.app }}
          cache-to: type=gha,scope=images-${{ matrix.app }},mode=max
          build-args: |
            BUN_IMAGE=${{ env.BUN_IMAGE }}
            BUILDKIT_SYNTAX=${{ env.DOCKERFILE_FRONTEND_IMAGE }}
            APT_UPGRADE_KEY=${{ steps.meta.outputs.apt-upgrade-key }}

      - name: Smoke
        env:
          APP: ${{ matrix.app }}
          NAME: ${{ steps.meta.outputs.name }}
        run: .github/scripts/image-smoke.sh "$APP" "${NAME}:sha-${GITHUB_SHA::12}"

      # THIRD_PARTY_NOTICES.md against what the image really holds (94S-338).
      - name: Licenses of what the image ships
        env:
          APP: ${{ matrix.app }}
          NAME: ${{ steps.meta.outputs.name }}
        run: .github/scripts/image-licenses.sh "$APP" "${NAME}:sha-${GITHUB_SHA::12}"

      # Findings never fail the build: `supply-chain` judges them, so the
      # build's check stays about the build. A scan that cannot run (release
      # download, database update) leaves `error` for that job as well.
      - name: Vulnerability scan
        continue-on-error: true
        timeout-minutes: 10
        env:
          APP: ${{ matrix.app }}
          NAME: ${{ steps.meta.outputs.name }}
        run: .github/scripts/image-scan.sh "$APP" "${NAME}:sha-${GITHUB_SHA::12}" vulnerabilities

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnerabilities-${{ matrix.app }}
          path: vulnerabilities/${{ matrix.app }}.*
          if-no-files-found: ignore

      # One JSON per image. `digest` is the manifest digest buildx computed;
      # a tag run's `publish` job overwrites the file with the registry one.
      # The image id (config digest) is what a local `docker images` shows.
      - name: Record digests
        env:
          APP: ${{ matrix.app }}
          NAME: ${{ steps.meta.outputs.name }}
          PUSHED: "false"
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          base="$(sed -n 's/^ARG BUN_IMAGE=//p' "apps/${APP}/Dockerfile")"
          mkdir -p digests
          jq -n \
            --arg app "$APP" --arg name "$NAME" --arg base "$base" \
            --arg digest "$DIGEST" --arg imageId "$IMAGE_ID" \
            --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" \
            --argjson pushed "$PUSHED" \
            '{app: $app, image: $name, base: $base, pushed: $pushed,
              digest: (if $digest == "" then null else $digest end),
              imageId: $imageId, commit: $sha, ref: $ref}' \
            | tee "digests/${APP}.json"
          {
            echo "### ${APP}"
            echo
            echo '```json'
            cat "digests/${APP}.json"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.app }}
          path: digests/${{ matrix.app }}.json
          if-no-files-found: error

  # The required check (94S-363). One job name whatever the event, so branch
  # protection can hold on to it. `always()`, not `!cancelled()`: a skipped
  # required check counts as passed (docs/ci.md), so it runs even when a
  # build failed or the run was cancelled, and then fails for the missing
  # result: no image, no verdict. The npm audit runs here rather than in its
  # own workflow so that one check covers both. When a scan got no answer
  # from its advisory service, a pull request or main push only warns: an
  # outage must not stop every merge, and the daily run and the release
  # still need a verdict.
  supply-chain:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vulnerabilities-*
          path: vulnerabilities
          merge-multiple: true
        # No artifact at all is judged below as missing results.
        continue-on-error: true
      - name: bun audit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun .github/scripts/npm-audit.ts vulnerabilities
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-results
          path: vulnerabilities/
          if-no-files-found: ignore
      - name: Verdict (fails on a fixable high or critical)
        env:
          NO_VERDICT: ${{ contains(fromJSON('["pull_request","push"]'), github.event_name) && !startsWith(github.ref, 'refs/tags/') && 'warn' || 'fail' }}
        run: .github/scripts/supply-chain-verdict.sh vulnerabilities "$NO_VERDICT"

  # Release path, three stages so a failed verification never leaves a
  # consumable version tag behind:
  #   publish  – per image: rebuild from the gha cache, push under a staging
  #              tag scoped to this run, pull the digest back, smoke it
  #   promote  – once all three staged digests passed: refuse if the version
  #              or sha tag already names a different digest, then retag the
  #              staged digests (registry-side, no rebuild) as vX and sha-…
  # Only a `push` of a `v*` tag qualifies: `workflow_dispatch` can name any
  # ref, tags included, so the event is checked as well as the ref. The
  # tagged commit must already be on main — a tag is not a review. The
  # `release` environment is where the repository adds required reviewers.
  publish:
    needs: [build, supply-chain]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [control-host, worker, egress-proxy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tagged commit must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main"
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - id: meta
        env:
          APP: ${{ matrix.app }}
          PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          name="${REGISTRY}/$(echo "$PREFIX" | tr '[:upper:]' '[:lower:]')-${APP}"
          echo "name=${name}" >>"$GITHUB_OUTPUT"
          echo "staging=${name}:staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >>"$GITHUB_OUTPUT"
          echo "apt-upgrade-key=$(date -u +%F)" >>"$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          tags: ${{ steps.meta.outputs.staging }}
          push: true
          provenance: false
          cache-from: type=gha,scope=images-${{ matrix.app }}
          build-args: |
            BUN_IMAGE=${{ env.BUN_IMAGE }}
            BUILDKIT_SYNTAX=${{ env.DOCKERFILE_FRONTEND_IMAGE }}
            APT_UPGRADE_KEY=${{ steps.meta.outputs.apt-upgrade-key }}
      - name: Smoke the pushed digest
        env:
          APP: ${{ matrix.app }}
          NAME: ${{ steps.meta.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker pull "${NAME}@${DIGEST}"
          .github/scripts/image-smoke.sh "$APP" "${NAME}@${DIGEST}"
      # The digest that gets promoted, not the build job's image: this job
      # builds again, and the apt layer is not pinned (a build job that ran
      # before UTC midnight upgraded on another key). The licenses must hold,
      # the scan must run, and a fixable high or critical finding stops the
      # release as it does `supply-chain` (94S-363).
      - name: Licenses and vulnerabilities of the pushed digest
        timeout-minutes: 10
        env:
          APP: ${{ matrix.app }}
          NAME: ${{ steps.meta.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          .github/scripts/image-licenses.sh "$APP" "${NAME}@${DIGEST}"
          .github/scripts/image-scan.sh "$APP" "${NAME}@${DIGEST}" vulnerabilities
          result="$(cat "vulnerabilities/${APP}.txt")"
          if [ "$result" != clean ]; then
            echo "::error::${APP}@${DIGEST}: ${result#found } high or critical with a fix available"
            exit 1
          fi
      - name: Record staged digest
        env:
          APP: ${{ matrix.app }}
          NAME: ${{ steps.meta.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_ID: ${{ steps.push.outputs.imageid }}
        run: |
          base="$(sed -n 's/^ARG BUN_IMAGE=//p' "apps/${APP}/Dockerfile")"
          mkdir -p staged
          jq -n \
            --arg app "$APP" --arg name "$NAME" --arg base "$base" \
            --arg digest "$DIGEST" --arg imageId "$IMAGE_ID" \
            --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" \
            '{app: $app, image: $name, base: $base, pushed: true, promoted: false,
              digest: $digest, imageId: $imageId, commit: $sha, ref: $ref}' \
            | tee "staged/${APP}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-digest-${{ matrix.app }}
          path: staged/${{ matrix.app }}.json
          if-no-files-found: error

  promote:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # One promotion at a time across the whole repository: two v* tags on the
    # same commit share the sha-<12> tag, and the check-then-write below is
    # only safe when no other promotion runs between the check and the write.
    concurrency:
      group: images-promote
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: staged-digest-*
          path: staged
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The staged digests of this run are the release candidates; a tag that
      # already names a different digest fails the promotion before any tag
      # is written, so one version never mixes images from two build
      # attempts. A half-promoted set (failure between repositories) is
      # completed with "Re-run failed jobs" on the same run: the publish jobs
      # are not rerun, their staged-digest artifacts are reused, and the tags
      # written before the failure name exactly those digests. Pushing the
      # tag again starts a new run with a fresh build (the worker's apt layer
      # is not pinned) and is refused by design. The lookup fails closed:
      # only a confirmed "not found" counts as absent; any other lookup
      # failure (auth, rate limit, 5xx) aborts. After tagging, all eight
      # references are read back and must name the candidates before the
      # published artifact is written. The set-level commit point consumers
      # resolve through (a release manifest) is D5.
      - name: Promote staged digests to version tags
        run: |
          set -euo pipefail
          test "$(ls staged/*.json | wc -l)" -eq 3
          version="${GITHUB_REF_NAME}"
          short="sha-${GITHUB_SHA::12}"
          lookup() {
            # Prints the digest the tag names, nothing when the registry
            # confirms it does not exist; any other failure exits non-zero.
            local ref="$1" out err status
            set +e
            out="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' 2>/tmp/lookup.err)"
            status=$?
            set -e
            err="$(cat /tmp/lookup.err)"
            if [ "$status" -eq 0 ]; then
              printf '%s' "$out" | tr -d '"'
              return 0
            fi
            case "$err" in
              *"not found"*|*MANIFEST_UNKNOWN*|*NAME_UNKNOWN*) return 0 ;;
            esac
            echo "::error::could not look up ${ref}: ${err}" >&2
            return 1
          }
          # Every lookup first, so a registry that cannot answer, or a tag
          # that already names something else, aborts before any repository
          # is touched. A tag that already names the candidate is a rerun.
          for file in staged/*.json; do
            name="$(jq -r .image "$file")"; digest="$(jq -r .digest "$file")"
            test -n "$digest"
            for tag in "$version" "$short"; do
              existing="$(lookup "${name}:${tag}")"
              if [ -n "$existing" ] && [ "$existing" != "$digest" ]; then
                echo "::error::${name}:${tag} already names ${existing}, refusing to move it to ${digest}; a new build of the same tag is not a rerun"
                exit 1
              fi
            done
          done
          for file in staged/*.json; do
            name="$(jq -r .image "$file")"; digest="$(jq -r .digest "$file")"
            # The staged image is a single manifest (provenance off); without
            # --prefer-index=false buildx wraps it in a new index, the tag
            # gets a digest the readback below would reject, and the written
            # tag then blocks every rerun. Verified against registry:2.
            docker buildx imagetools create --prefer-index=false \
              -t "${name}:${version}" -t "${name}:${short}" "${name}@${digest}"
          done
          # Read back what the registry now says, and only then call it
          # published. The artifact describes the tags, not the intention.
          mkdir -p digests
          for file in staged/*.json; do
            app="$(jq -r .app "$file")"; name="$(jq -r .image "$file")"; digest="$(jq -r .digest "$file")"
            for tag in "$version" "$short"; do
              actual="$(lookup "${name}:${tag}")"
              if [ "$actual" != "$digest" ]; then
                echo "::error::after promotion ${name}:${tag} names '${actual}', expected ${digest}"
                exit 1
              fi
            done
            jq '.promoted = true | .tags = [$v, $s]' --arg v "$version" --arg s "$short" \
              "$file" >"digests/${app}.json"
            {
              echo "### ${app} (published)"
              echo
              echo '```json'
              cat "digests/${app}.json"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digests-published
          path: digests/*.json
          if-no-files-found: error

  # The daily run's failed verdict as an issue: nobody watches a scheduled
  # run, and a PR's findings are already in its own checks. A manual run
  # reports too, so the path can be exercised on demand.
  vulnerability-report:
    needs: [build, supply-chain]
    if: always() && contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && needs.supply-chain.result != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: supply-chain-results
          path: vulnerabilities
        continue-on-error: true
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "<!-- ci-supply-chain -->"
            echo "The daily supply-chain check on \`${GITHUB_SHA}\` ([run ${GITHUB_RUN_ID}](${RUN_URL})) found high or critical vulnerabilities with a fix available, or could not scan."
            echo
            echo "| scan | result |"
            echo "| --- | --- |"
            for scan in control-host worker egress-proxy npm; do
              echo "| ${scan} | $(cat "vulnerabilities/${scan}.txt" 2>/dev/null || echo "no result") |"
            done
            echo
            echo "Each finding is in the run summary and the \`supply-chain-results\` artifact. Update the package or base image, or record an exception with its reason and expiry in \`.github/vulnerability-exceptions.json\` (docs/operations.md § 공급망 취약점 정책). Until then every pull request's \`supply-chain\` check fails too. Close this issue once handled; the next finding opens a new one."
          } >body.md
          .github/scripts/upsert-ci-issue.sh ci-supply-chain \
            "Supply chain: fixable high or critical vulnerabilities" body.md
