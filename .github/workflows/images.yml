name: Images

# Builds the three app images (apps/*/Dockerfile) on every pull request and
# main push, smokes the worker's bundled Claude Code executable, and records
# every digest as an artifact. A push to main and a v* tag push publish to
# ghcr.io, and nothing else does. A main push publishes main-<12> tags with no
# approval; a tag waits for the `release` environment once, at `publish`, and
# its digests are what the release manifest pins. Registry CD
# beyond the push is D5. After the promotion the chart follows, with that run's
# digests in its values, under the same two events and the same single approval. A tag
# then gets a GitHub Release carrying the manifest (`release`). A merge that
# turns CHANGELOG.md's `## 미출시` into `## vX.Y.Z` releases from its own main
# push run instead (the `release-*` jobs): one approval, the tag made last.
#
# Every build also checks what the image ships against THIRD_PARTY_NOTICES.md
# and scans it for known vulnerabilities. The `supply-chain` job is
# the verdict, a required check: a high or critical vulnerability with a fix
# available, in an image or anywhere in bun.lock, fails it; one without a fix
# is only reported. A publish waits for the same verdict on
# the build and on the digest it promotes. The daily run turns a failed
# verdict into an issue (`vulnerability-report`).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# Read-only for every job but the publish, index and promote jobs: a pull
# request can edit this file, so a token with package write in the PR job would
# let a branch publish images before merge. Those jobs alone get package write,
# and only run on a main or tag push. `release` alone gets contents write, and
# only runs on a tag push.
permissions:
  contents: read

# One group per main commit, never cancelled: a later merge must neither drop
# this commit's images nor stop a promotion between repositories.
concurrency:
  group: images-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  REGISTRY: ghcr.io
  # Lower-cased in the metadata step: ghcr rejects upper-case repository paths.
  # The owner, not github.repository: the images are named werft-*, whatever
  # the repository is called.
  IMAGE_PREFIX: ${{ github.repository_owner }}/werft
  # Pulled from the CI mirror, not Docker Hub: the Dockerfiles'
  # own BUN_IMAGE by the same digest, so the image bytes do not change, the
  # BuildKit that setup-buildx-action runs, and the Dockerfile frontend.
  # ci-image-mirror.yml copies them; tests/ci-images.test.ts holds them to
  # that list and the Dockerfiles.
  BUN_IMAGE: ghcr.io/jeongjaesoon/werft-ci/bun@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
  BUILDKIT_IMAGE: ghcr.io/jeongjaesoon/werft-ci/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
  # The frontend the Dockerfiles' `# syntax=` line names, by the digest of
  # that tag; BUILDKIT_SYNTAX overrides the line, which BuildKit would
  # otherwise resolve on Docker Hub.
  DOCKERFILE_FRONTEND_IMAGE: ghcr.io/jeongjaesoon/werft-ci/dockerfile@sha256:a57df69d0ea827fb7266491f2813635de6f17269be881f696fbfdf2d83dda33e
  # The tools of ci.yml's k8s-smoke, by the same pins; tests/images.test.ts
  # holds the two together.
  HELM_VERSION: v4.3.0
  HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
  KIND_VERSION: v0.33.0
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
  KUBECTL_VERSION: v1.37.0
  KUBECTL_SHA256: 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f

jobs:
  build:
    # Pinned rather than ubuntu-latest for the same reason as ci.yml.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: &image-matrix
        app: [control-host, worker, egress-proxy]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - id: meta
        name: Image name and tags
        env:
          APP: ${{ matrix.app }}
          PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          name="${REGISTRY}/$(echo "$PREFIX" | tr '[:upper:]' '[:lower:]')-${APP}"
          echo "name=${name}" >>"$GITHUB_OUTPUT"
          echo "tags=${name}:sha-${GITHUB_SHA::12}" >>"$GITHUB_OUTPUT"
          # The Dockerfiles' APT_UPGRADE_KEY: a new day misses the
          # cached `apt-get upgrade` layer, so the daily run scans that day's
          # Debian fixes rather than the first build's.
          echo "apt-upgrade-key=$(date -u +%F)" >>"$GITHUB_OUTPUT"

      # `load` puts the image in the runner's daemon for the smoke below.
      # Nothing is pushed from this job; see `publish` and `publish-main`.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: release
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.meta.outputs.tags }}
          load: true
          push: false
          provenance: false
          cache-from: type=gha,scope=images-${{ matrix.app }}-${{ matrix.arch }}
          # A pull request reads the cache and never writes it: its code is
          # untrusted, and its ref-scoped entries only crowd the repository's
          # cache quota. An empty value adds no --cache-to flag.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,scope=images-{0}-{1},mode=max', matrix.app, matrix.arch) || '' }}
          build-args: |
            BUN_IMAGE=${{ env.BUN_IMAGE }}
            BUILDKIT_SYNTAX=${{ env.DOCKERFILE_FRONTEND_IMAGE }}
            APT_UPGRADE_KEY=${{ steps.meta.outputs.apt-upgrade-key }}

      - name: Smoke
        env:
          APP: ${{ matrix.app }}
          NAME: ${{ steps.meta.outputs.name }}
        run: .github/scripts/image-smoke.sh "$APP" "${NAME}:sha-${GITHUB_SHA::12}"

      # THIRD_PARTY_NOTICES.md against what the image really holds.
      - name: Licenses of what the image ships
        env:
          APP: ${{ matrix.app }}
          NAME: ${{ steps.meta.outputs.name }}
        run: .github/scripts/image-licenses.sh "$APP" "${NAME}:sha-${GITHUB_SHA::12}"

      # Findings never fail the build: `supply-chain` judges them, so the
      # build's check stays about the build. A scan that cannot run (release
      # download, database update) fails the build: no verdict is not a pass.
      # The `error` it leaves in the result file is what `supply-chain` reads.
      - name: Vulnerability scan
        timeout-minutes: 10
        env:
          APP: ${{ matrix.app }}
          ARCH: ${{ matrix.arch }}
          NAME: ${{ steps.meta.outputs.name }}
        run: .github/scripts/image-scan.sh "${APP}-${ARCH}" "${NAME}:sha-${GITHUB_SHA::12}" vulnerabilities

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnerabilities-${{ matrix.app }}-${{ matrix.arch }}
          path: vulnerabilities/${{ matrix.app }}-${{ matrix.arch }}.*
          if-no-files-found: ignore

      # One JSON per image. `digest` is the manifest digest buildx computed,
      # of this job's image, not of the one a publish job builds again; the
      # published digests are in `image-digests-published`.
      # The image id (config digest) is what a local `docker images` shows.
      - name: Record digests
        env:
          APP: ${{ matrix.app }}
          ARCH: ${{ matrix.arch }}
          NAME: ${{ steps.meta.outputs.name }}
          PUSHED: "false"
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          base="$(sed -n 's/^ARG BUN_IMAGE=//p' "apps/${APP}/Dockerfile")"
          runtime=null
          if [ "$APP" = worker ]; then
            runtime="$(docker run --rm -i --network none --entrypoint bun \
              "${NAME}:sha-${GITHUB_SHA::12}" run apps/worker/src/image-runtime.ts \
              <<<'{}' | jq -c 'del(.profiles)')"
          fi
          mkdir -p digests
          jq -n \
            --arg app "$APP" --arg arch "$ARCH" --arg name "$NAME" --arg base "$base" \
            --arg digest "$DIGEST" --arg imageId "$IMAGE_ID" \
            --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" \
            --argjson pushed "$PUSHED" --argjson runtime "$runtime" \
            '{app: $app, arch: $arch, image: $name, base: $base, pushed: $pushed,
              digest: (if $digest == "" then null else $digest end),
              imageId: $imageId, commit: $sha, ref: $ref, runtime: $runtime}' \
            | tee "digests/${APP}-${ARCH}.json"
          {
            echo "### ${APP} (${ARCH})"
            echo
            echo '```json'
            cat "digests/${APP}-${ARCH}.json"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.app }}-${{ matrix.arch }}
          path: digests/${{ matrix.app }}-${{ matrix.arch }}.json
          if-no-files-found: error

  # The required check. One job name whatever the event, so branch
  # protection can hold on to it. `always()`, not `!cancelled()`: a skipped
  # required check counts as passed (docs/contributing/ci.md), so it runs even when a
  # build failed or the run was cancelled, and then fails for the missing
  # result: no image, no verdict. The npm audit runs here rather than in its
  # own workflow so that one check covers both. When a scan got no answer
  # from its advisory service, a pull request or main push only warns: an
  # outage must not stop every merge, and the daily run and a publish
  # still need a verdict.
  supply-chain:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs nothing; npm-audit.ts imports only node: built-ins and
      # `bun audit` reads bun.lock, not the install cache.
      - uses: ./.github/actions/bun-setup
        with:
          restore-cache: "false"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vulnerabilities-*
          path: vulnerabilities
          merge-multiple: true
        # No artifact at all is judged below as missing results.
        continue-on-error: true
      - name: bun audit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun .github/scripts/npm-audit.ts vulnerabilities
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-results
          path: vulnerabilities/
          if-no-files-found: ignore
      - name: Verdict (fails on a fixable high or critical)
        env:
          NO_VERDICT: ${{ contains(fromJSON('["pull_request","push"]'), github.event_name) && !startsWith(github.ref, 'refs/tags/') && 'warn' || 'fail' }}
        run: .github/scripts/supply-chain-verdict.sh vulnerabilities "$NO_VERDICT"

  # Publish path, in stages so a failed verification never leaves a consumable
  # tag behind.
  # Two chains of jobs run the same steps. `publish`, `index` and `promote` are
  # the release: a `push` of a `v*` tag writes vX and sha-… under the `release`
  # environment, where the repository adds required reviewers. Only `publish`
# names it: `index`, `promote` and `chart-publish` need `publish` to succeed, so
# the one approval gates all of them and a second prompt would only repeat it.
# The environment holds no secrets or variables, and no job here reads an OIDC
# claim, so dropping it from the later jobs loses nothing. The `-main` jobs
  # write main-<12> on a push to main, reviewed by the merge itself, so no
  # environment. sha-<12> is not reused there: a build on another day has
  # another digest, and promote would refuse the tag.
  # `workflow_dispatch` can name any ref, so the event is checked as well as
  # the ref. The commit must be on main — a tag is not a review.
  publish:
    needs: [build, supply-chain]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: *image-matrix
    steps: &publish-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # `supply-chain` passes a main push whose scan got no answer; publishing
      # still needs the verdict, npm audit of the whole bun.lock included.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: supply-chain-results
          path: supply-chain-results
      - name: Every scan answered
        run: .github/scripts/supply-chain-verdict.sh supply-chain-results fail
      - name: Commit must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main"
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - id: meta
        env:
          APP: ${{ matrix.app }}
          ARCH: ${{ matrix.arch }}
          PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          name="${REGISTRY}/$(echo "$PREFIX" | tr '[:upper:]' '[:lower:]')-${APP}"
          echo "name=${name}" >>"$GITHUB_OUTPUT"
          echo "staging=${name}:staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}" >>"$GITHUB_OUTPUT"
          echo "apt-upgrade-key=$(date -u +%F)" >>"$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: release
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.meta.outputs.staging }}
          push: true
          provenance: false
          cache-from: type=gha,scope=images-${{ matrix.app }}-${{ matrix.arch }}
          build-args: |
            BUN_IMAGE=${{ env.BUN_IMAGE }}
            BUILDKIT_SYNTAX=${{ env.DOCKERFILE_FRONTEND_IMAGE }}
            APT_UPGRADE_KEY=${{ steps.meta.outputs.apt-upgrade-key }}
      - name: Smoke the pushed digest
        env:
          APP: ${{ matrix.app }}
          NAME: ${{ steps.meta.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker pull "${NAME}@${DIGEST}"
          .github/scripts/image-smoke.sh "$APP" "${NAME}@${DIGEST}"
      # The digest that gets promoted, not the build job's image: this job
      # builds again, and the apt layer is not pinned (a build job that ran
      # before UTC midnight upgraded on another key). The licenses must hold,
      # the scan must run, and a fixable high or critical finding stops the
      # publish as it does `supply-chain`.
      - name: Licenses and vulnerabilities of the pushed digest
        timeout-minutes: 10
        env:
          APP: ${{ matrix.app }}
          ARCH: ${{ matrix.arch }}
          NAME: ${{ steps.meta.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          .github/scripts/image-licenses.sh "$APP" "${NAME}@${DIGEST}"
          .github/scripts/image-scan.sh "${APP}-${ARCH}" "${NAME}@${DIGEST}" vulnerabilities
          result="$(cat "vulnerabilities/${APP}-${ARCH}.txt")"
          if [ "$result" != clean ]; then
            echo "::error::${APP}-${ARCH}@${DIGEST}: ${result#found } high or critical with a fix available"
            exit 1
          fi
      - name: Record staged digest
        env:
          APP: ${{ matrix.app }}
          ARCH: ${{ matrix.arch }}
          NAME: ${{ steps.meta.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_ID: ${{ steps.push.outputs.imageid }}
        run: |
          base="$(sed -n 's/^ARG BUN_IMAGE=//p' "apps/${APP}/Dockerfile")"
          runtime=null
          if [ "$APP" = worker ]; then
            runtime="$(docker run --rm -i --network none --entrypoint bun \
              "${NAME}@${DIGEST}" run apps/worker/src/image-runtime.ts \
              <<<'{}' | jq -c 'del(.profiles)')"
          fi
          mkdir -p arch-staged debian-sources
          docker run --rm --entrypoint cat "${NAME}@${DIGEST}" /app/DEBIAN_SOURCES.md \
            >"debian-sources/${APP}-${ARCH}.md"
          jq -n \
            --arg app "$APP" --arg arch "$ARCH" --arg name "$NAME" --arg base "$base" \
            --arg digest "$DIGEST" --arg imageId "$IMAGE_ID" \
            --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" \
            --argjson runtime "$runtime" \
            '{app: $app, arch: $arch, image: $name, base: $base, pushed: true,
              promoted: false, digest: $digest, imageId: $imageId, commit: $sha,
              ref: $ref, runtime: $runtime}' \
            | tee "arch-staged/${APP}-${ARCH}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch-digest-${{ matrix.app }}-${{ matrix.arch }}
          path: arch-staged/${{ matrix.app }}-${{ matrix.arch }}.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debian-sources-${{ matrix.app }}-${{ matrix.arch }}
          path: debian-sources/${{ matrix.app }}-${{ matrix.arch }}.md
          if-no-files-found: error

  sources:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps: &sources-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: debian-sources-*
          path: debian-sources
          merge-multiple: true
      # Re-run failed jobs starts this job over, so what an earlier attempt
      # of this run already found held comes back as an artifact: the same run
      # sees only its own commit's images, and the job name keeps `sources`
      # and `sources-main` apart. Without one the check asks about everything.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.run_attempt > 1
        continue-on-error: true
        with:
          pattern: held-sources-${{ github.job }}-*
          path: held-sources-prior
      - name: snapshot.debian.org holds what the images list
        env:
          SOURCES_MODE: ${{ env.RELEASE_REF == '' && github.ref == 'refs/heads/main' && 'main' || 'release' }}
        run: .github/scripts/image-sources.sh debian-sources unverified-sources "$SOURCES_MODE" held-sources-prior held-sources
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: held-sources-${{ github.job }}-${{ github.run_attempt }}
          path: held-sources/held.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unverified-sources${{ env.ARTIFACT_SUFFIX }}
          path: unverified-sources/*.json
          if-no-files-found: error

  index:
    needs: sources
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps: &index-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: arch-digest-*
          path: arch-staged
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unverified-sources
          path: unverified-sources
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join each image's two digests
        run: .github/scripts/image-index.sh arch-staged unverified-sources staged
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-digests
          path: staged/*.json
          if-no-files-found: error

  promote:
    needs: index
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # One promotion at a time across the whole repository: two v* tags on the
    # same commit share the sha-<12> tag, and the check-then-write below is
    # only safe when no other promotion runs between the check and the write.
    concurrency:
      group: images-promote
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps: &promote-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staged-digests
          path: staged
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The tags depend on the run: vX and sha-… for a tag, main-<12> for
      # main. The set-level record consumers resolve through is the release
      # manifest of a tag (`release`), built from the artifact below.
      - name: Promote staged digests
        run: .github/scripts/image-promote.sh staged digests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digests-published
          path: digests/*.json
          if-no-files-found: error

  publish-main:
    needs: [build, supply-chain]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: *image-matrix
    steps: *publish-steps

  sources-main:
    needs: publish-main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps: *sources-steps

  index-main:
    needs: sources-main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps: *index-steps

  # No job-level concurrency: main-<12> belongs to one commit and the workflow
  # group already runs one run per commit. Sharing `images-promote` would let
  # a queued merge replace another's pending promotion.
  promote-main:
    needs: index-main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps: *promote-steps

  # The chart of a promoted image set. Like publish and promote, a pair per
  # event, each with its own `needs`: one job needing both would be skipped
  # along with the path that did not run.
  #   chart          package with the digests the promotion just read back,
  #                  install that package on kind and reach /readyz, all
  #                  without package write: a chart that cannot install is
  #                  not published
  #   chart-publish  push the package and read it back with no login
  chart:
    needs: promote
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps: &chart-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
      - &helm-tool
        name: helm
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz -C bin --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: kind and kubectl
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo bin/kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  bin/kind" | sha256sum -c -
          curl -fsSLo bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  bin/kubectl" | sha256sum -c -
          chmod +x bin/kind bin/kubectl
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-digests-published${{ env.ARTIFACT_SUFFIX }}
          path: published
      - name: Package the chart with this run's images
        run: bun .github/scripts/chart-package.ts published chart-out
      # The chart runs no worker on an empty install, so kind alone would not
      # notice a worker digest nobody can pull. No job here has logged in.
      - name: Every image reads without a login
        run: |
          for file in published/*.json; do
            for ref in $(jq -r '.image as $name | .digest, .platforms[].digest | "\($name)@\(.)"' "$file"); do
              docker manifest inspect "$ref" >/dev/null
              echo "read ${ref}"
            done
          done
      - name: Install the package on kind
        env:
          CLUSTER_NAME: chart-check
          STATE_DIR: ${{ runner.temp }}/kind
          KIND_NODE_IMAGE: ghcr.io/jeongjaesoon/werft-ci/kind-node@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          REGISTRY_IMAGE: ghcr.io/jeongjaesoon/werft-ci/registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        run: |
          CHART_PACKAGE="$(ls "$PWD"/chart-out/werft-*.tgz)" KIND_IMAGE_MIRROR="${BUN_IMAGE%/*}" deploy/kind/up.sh
      - if: failure()
        name: Why the install stopped
        env:
          KUBECONFIG: ${{ runner.temp }}/kind/kubeconfig
        run: |
          kubectl -n werft get jobs,deploy,pods -o wide || true
          kubectl -n werft get events --sort-by=.lastTimestamp || true
      - if: '!cancelled()'
        name: Nothing pulled from Docker Hub
        run: .github/scripts/assert-no-docker-hub-images.sh docker
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart${{ env.ARTIFACT_SUFFIX }}
          path: chart-out/
          if-no-files-found: error

  chart-main:
    needs: promote-main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps: *chart-steps

  chart-publish:
    needs: chart
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps: &chart-publish-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *helm-tool
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chart${{ env.ARTIFACT_SUFFIX }}
          path: chart-out
      - name: Push the chart and read it back without a login
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          .github/scripts/chart-push.sh chart-out/werft-*.tgz \
            "${REGISTRY}/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"

  # The single-server bundle (scripts/test-ops.sh, its compose files and the
  # manifest, no image) is built and checked on every run; only a tag's
  # `release` job uploads it. Here it is built twice from a fixed manifest, and
  # the two archives must be the same bytes, which a rerun of a release relies on.
  test-ops-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the bundle twice
        run: |
          fixture=tests/fixtures/test-ops-release-manifest.json
          tag="$(jq -r .tag "$fixture")"
          .github/scripts/test-ops-bundle.sh "$tag" "$fixture" bundle-a
          .github/scripts/test-ops-bundle.sh "$tag" "$fixture" bundle-b
          cmp "bundle-a/werft-test-ops-${tag}.tar.gz" "bundle-b/werft-test-ops-${tag}.tar.gz"
          tar -tzf "bundle-a/werft-test-ops-${tag}.tar.gz"
      - name: Run the bundle's scripts without a checkout
        run: |
          tag="$(jq -r .tag tests/fixtures/test-ops-release-manifest.json)"
          tar -xzf "bundle-a/werft-test-ops-${tag}.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/werft-test-ops-${tag}"
          sha256sum -c --quiet SHA256SUMS
          bash scripts/test-ops.sh manifest release-manifest.json infra/test-ops.env.example | jq -e '.images.control_host'
          if bash scripts/test-ops.sh upgrade release-manifest.json; then echo "upgrade must be refused in a bundle" >&2; exit 1; fi

  # The GitHub Release of a tag, with one manifest file: the three image
  # digests, the worker runtime and the chart version. It comes last because
  # the chart is final only once chart-publish has read it back, and it alone
  # holds contents: write. The release is a draft until the manifest is read
  # back; a rerun of the same tag passes on the same content and fails on other
  # content (.github/scripts/release-publish.sh). Main runs publish no release.
  release:
    needs: chart-publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: images-release
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps: &release-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bun-setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-digests-published${{ env.ARTIFACT_SUFFIX }}
          path: published
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chart${{ env.ARTIFACT_SUFFIX }}
          path: chart-out
      - name: Write the manifest
        run: bun .github/scripts/release-manifest.ts published chart-out release-manifest.json
      - name: Build the single-server bundle
        run: |
          ref="${RELEASE_REF:-$GITHUB_REF}"
          .github/scripts/test-ops-bundle.sh "${ref#refs/tags/}" release-manifest.json bundle-out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ref="${RELEASE_REF:-$GITHUB_REF}"
          tag="${ref#refs/tags/}"
          .github/scripts/release-publish.sh "$tag" release-manifest.json \
            "bundle-out/werft-test-ops-${tag}.tar.gz" \
            "bundle-out/werft-test-ops-${tag}.tar.gz.sha256"
      - name: Show the manifest
        run: |
          {
            echo '```json'
            cat release-manifest.json
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  chart-publish-main:
    needs: chart-main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps: *chart-publish-steps

  # A release by merge. A pull request that turns CHANGELOG.md's `## 미출시`
  # into `## vX.Y.Z` releases that version from the push that merges it, in
  # this run, with one approval and no tag before it:
  #   release-detect   reads the one new version heading of this push; no new
  #                    heading, no other release job runs
  #   release-gate     main's whole chain and ci.yml are green on this commit
  #   sources-release  every Debian source is verified (main only warns)
  #   release-approve  the `release` environment: the only approval, the same
  #                    environment a pushed tag waits for at `publish`
  #   promote-release  vX and sha-<12> on the digests main already built,
  #                    smoked and scanned: what was scanned is what ships
  #   chart-release, chart-publish-release, release-tag, release-publish
  #                    the pushed-tag chain's tail, with the tag made last
  # `RELEASE_REF` stands in for GITHUB_REF in the scripts of these jobs, and
  # ARTIFACT_SUFFIX keeps their artifacts apart from main's in the same run.
  # A tag a person pushes runs its own chain above, unchanged.
  release-detect:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-auto.sh detect

  release-gate:
    needs: [release-detect, chart-publish-main]
    if: needs.release-detect.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ci.yml is green on this commit
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-auto.sh ci
      - name: The version is still free
        env:
          TAG: ${{ needs.release-detect.outputs.tag }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-auto.sh free

  sources-release:
    needs: [release-detect, publish-main]
    if: needs.release-detect.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RELEASE_REF: refs/tags/${{ needs.release-detect.outputs.tag }}
      ARTIFACT_SUFFIX: -release
    steps: *sources-steps

  release-approve:
    needs: [release-detect, release-gate, sources-release]
    if: needs.release-detect.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    steps:
      - name: Approved
        env:
          TAG: ${{ needs.release-detect.outputs.tag }}
        run: echo "release ${TAG} of ${GITHUB_SHA} is approved; no tag exists yet"

  # Shares `images-promote` with the pushed-tag chain: both write vX and sha-<12>,
  # and the check-then-write in image-promote.sh is only safe one at a time.
  promote-release:
    needs: [release-detect, release-approve, index-main]
    if: needs.release-detect.outputs.tag != ''
    concurrency:
      group: images-promote
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_REF: refs/tags/${{ needs.release-detect.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Inside the promote lock: a tag or Release made during the approval wait
      # must stop the run before any vX image is published.
      - name: The version is still free
        env:
          TAG: ${{ needs.release-detect.outputs.tag }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-auto.sh free
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staged-digests
          path: staged-main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unverified-sources-release
          path: unverified-release
      - name: Stage main's digests as the release's
        run: .github/scripts/release-stage.sh staged-main unverified-release staged
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the staged digests under the release tag
        run: .github/scripts/image-promote.sh staged digests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digests-published-release
          path: digests/*.json
          if-no-files-found: error

  chart-release:
    needs: [release-detect, promote-release]
    if: needs.release-detect.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_REF: refs/tags/${{ needs.release-detect.outputs.tag }}
      ARTIFACT_SUFFIX: -release
    steps: *chart-steps

  chart-publish-release:
    needs: [release-detect, chart-release]
    if: needs.release-detect.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      ARTIFACT_SUFFIX: -release
    steps: *chart-publish-steps

  # The tag comes last, after the approval and after everything it names has
  # been published, so a rejected or failed release leaves no tag behind.
  # A GITHUB_TOKEN tag starts no run of its own: nothing else publishes.
  release-tag:
    needs: [release-detect, chart-publish-release]
    if: needs.release-detect.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Annotated tag at the approved commit
        env:
          TAG: ${{ needs.release-detect.outputs.tag }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-auto.sh tag

  release-publish:
    needs: [release-detect, release-tag]
    if: needs.release-detect.outputs.tag != ''
    concurrency:
      group: images-release
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_REF: refs/tags/${{ needs.release-detect.outputs.tag }}
      ARTIFACT_SUFFIX: -release
    steps: *release-steps

  # The daily run's failed verdict as an issue: nobody watches a scheduled
  # run, and a PR's findings are already in its own checks. A manual run
  # reports too, so the path can be exercised on demand.
  vulnerability-report:
    needs: [build, supply-chain]
    if: always() && contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && needs.supply-chain.result != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: supply-chain-results
          path: vulnerabilities
        continue-on-error: true
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "<!-- ci-supply-chain -->"
            echo "The daily supply-chain check on \`${GITHUB_SHA}\` ([run ${GITHUB_RUN_ID}](${RUN_URL})) found high or critical vulnerabilities with a fix available, or could not scan."
            echo
            echo "| scan | result |"
            echo "| --- | --- |"
            for scan in {control-host,worker,egress-proxy}-{amd64,arm64} npm; do
              echo "| ${scan} | $(cat "vulnerabilities/${scan}.txt" 2>/dev/null || echo "no result") |"
            done
            echo
            echo "Each finding is in the run summary and the \`supply-chain-results\` artifact. Update the package or base image, or record an exception with its reason and expiry in \`.github/vulnerability-exceptions.json\` (site page run-server/self-hosting/operate/images-and-supply-chain § 공급망 취약점 정책). Until then every pull request's \`supply-chain\` check fails too. Close this issue once handled; the next finding opens a new one."
          } >body.md
          .github/scripts/upsert-ci-issue.sh ci-supply-chain \
            "Supply chain: fixable high or critical vulnerabilities" body.md
