name: Images

# Builds the three app images (apps/*/Dockerfile) on every pull request and
# main push, smokes the worker's bundled Claude Code executable, and records
# every digest as an artifact. A push to main and a v* tag push publish to
# ghcr.io, and nothing else does. A main push publishes main-<12> tags with no
# approval; a tag waits for the `release` environment, and its digests are what
# a release manifest pins (Obsidian deployment.md § 배포·승격·롤백). Registry CD
# beyond the push is D5. After the promotion the chart follows, with that run's
# digests in its values, under the same two events and the same approval.
#
# Every build also checks what the image ships against THIRD_PARTY_NOTICES.md
# and scans it for known vulnerabilities. The `supply-chain` job is
# the verdict, a required check: a high or critical vulnerability with a fix
# available, in an image or anywhere in bun.lock, fails it; one without a fix
# is only reported. A publish waits for the same verdict on
# the build and on the digest it promotes. The daily run turns a failed
# verdict into an issue (`vulnerability-report`).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# Read-only for every job but the publish and promote jobs: a pull request can
# edit this file, so a token with package write in the PR job would let a branch
# publish images before merge. Those jobs alone get package write, and only run
# on a main or tag push.
permissions:
  contents: read

# One group per main commit, never cancelled: a later merge must neither drop
# this commit's images nor stop a promotion between repositories.
concurrency:
  group: images-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  REGISTRY: ghcr.io
  # Lower-cased in the metadata step: ghcr rejects upper-case repository paths.
  # The owner, not github.repository: the images are named werft-*, whatever
  # the repository is called.
  IMAGE_PREFIX: ${{ github.repository_owner }}/werft
  # Pulled from the CI mirror, not Docker Hub: the Dockerfiles'
  # own BUN_IMAGE by the same digest, so the image bytes do not change, the
  # BuildKit that setup-buildx-action runs, and the Dockerfile frontend.
  # ci-image-mirror.yml copies them; tests/ci-images.test.ts holds them to
  # that list and the Dockerfiles.
  BUN_IMAGE: ghcr.io/jeongjaesoon/agent-platform-ci/bun@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
  BUILDKIT_IMAGE: ghcr.io/jeongjaesoon/agent-platform-ci/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
  # The frontend the Dockerfiles' `# syntax=` line names, by the digest of
  # that tag; BUILDKIT_SYNTAX overrides the line, which BuildKit would
  # otherwise resolve on Docker Hub.
  DOCKERFILE_FRONTEND_IMAGE: ghcr.io/jeongjaesoon/agent-platform-ci/dockerfile@sha256:a57df69d0ea827fb7266491f2813635de6f17269be881f696fbfdf2d83dda33e
  # The tools of ci.yml's k8s-smoke, by the same pins; tests/images.test.ts
  # holds the two together.
  HELM_VERSION: v4.3.0
  HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
  KIND_VERSION: v0.33.0
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
  KUBECTL_VERSION: v1.37.0
  KUBECTL_SHA256: 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f

jobs:
  build:
    # Pinned rather than ubuntu-latest for the same reason as ci.yml.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [control-host, worker, egress-proxy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - id: meta
        name: Image name and tags
        env:
          APP: ${{ matrix.app }}
          PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          name="${REGISTRY}/$(echo "$PREFIX" | tr '[:upper:]' '[:lower:]')-${APP}"
          echo "name=${name}" >>"$GITHUB_OUTPUT"
          echo "tags=${name}:sha-${GITHUB_SHA::12}" >>"$GITHUB_OUTPUT"
          # The Dockerfiles' APT_UPGRADE_KEY: a new day misses the
          # cached `apt-get upgrade` layer, so the daily run scans that day's
          # Debian fixes rather than the first build's.
          echo "apt-upgrade-key=$(date -u +%F)" >>"$GITHUB_OUTPUT"

      # `load` puts the image in the runner's daemon for the smoke below.
      # Nothing is pushed from this job; see `publish` and `publish-main`.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          load: true
          push: false
          provenance: false
          cache-from: type=gha,scope=images-${{ matrix.app }}
          cache-to: type=gha,scope=images-${{ matrix.app }},mode=max
          build-args: |
            BUN_IMAGE=${{ env.BUN_IMAGE }}
            BUILDKIT_SYNTAX=${{ env.DOCKERFILE_FRONTEND_IMAGE }}
            APT_UPGRADE_KEY=${{ steps.meta.outputs.apt-upgrade-key }}

      - name: Smoke
        env:
          APP: ${{ matrix.app }}
          NAME: ${{ steps.meta.outputs.name }}
        run: .github/scripts/image-smoke.sh "$APP" "${NAME}:sha-${GITHUB_SHA::12}"

      # THIRD_PARTY_NOTICES.md against what the image really holds.
      - name: Licenses of what the image ships
        env:
          APP: ${{ matrix.app }}
          NAME: ${{ steps.meta.outputs.name }}
          # publish-main asks about the digest that goes out; on a main push
          # this build's answer would only warn about an image nobody gets.
          LICENSE_MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'skip-snapshot' || 'build' }}
        run: .github/scripts/image-licenses.sh "$APP" "${NAME}:sha-${GITHUB_SHA::12}" "$LICENSE_MODE"

      # Findings never fail the build: `supply-chain` judges them, so the
      # build's check stays about the build. A scan that cannot run (release
      # download, database update) leaves `error` for that job as well.
      - name: Vulnerability scan
        continue-on-error: true
        timeout-minutes: 10
        env:
          APP: ${{ matrix.app }}
          NAME: ${{ steps.meta.outputs.name }}
        run: .github/scripts/image-scan.sh "$APP" "${NAME}:sha-${GITHUB_SHA::12}" vulnerabilities

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnerabilities-${{ matrix.app }}
          path: vulnerabilities/${{ matrix.app }}.*
          if-no-files-found: ignore

      # One JSON per image. `digest` is the manifest digest buildx computed,
      # of this job's image, not of the one a publish job builds again; the
      # published digests are in `image-digests-published`.
      # The image id (config digest) is what a local `docker images` shows.
      - name: Record digests
        env:
          APP: ${{ matrix.app }}
          NAME: ${{ steps.meta.outputs.name }}
          PUSHED: "false"
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          base="$(sed -n 's/^ARG BUN_IMAGE=//p' "apps/${APP}/Dockerfile")"
          runtime=null
          if [ "$APP" = worker ]; then
            runtime="$(docker run --rm -i --network none --entrypoint bun \
              "${NAME}:sha-${GITHUB_SHA::12}" run apps/worker/src/image-runtime.ts \
              <<<'{}' | jq -c 'del(.profiles)')"
          fi
          mkdir -p digests
          jq -n \
            --arg app "$APP" --arg name "$NAME" --arg base "$base" \
            --arg digest "$DIGEST" --arg imageId "$IMAGE_ID" \
            --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" \
            --argjson pushed "$PUSHED" --argjson runtime "$runtime" \
            '{app: $app, image: $name, base: $base, pushed: $pushed,
              digest: (if $digest == "" then null else $digest end),
              imageId: $imageId, commit: $sha, ref: $ref, runtime: $runtime}' \
            | tee "digests/${APP}.json"
          {
            echo "### ${APP}"
            echo
            echo '```json'
            cat "digests/${APP}.json"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.app }}
          path: digests/${{ matrix.app }}.json
          if-no-files-found: error

  # The required check. One job name whatever the event, so branch
  # protection can hold on to it. `always()`, not `!cancelled()`: a skipped
  # required check counts as passed (docs/contributing/ci.md), so it runs even when a
  # build failed or the run was cancelled, and then fails for the missing
  # result: no image, no verdict. The npm audit runs here rather than in its
  # own workflow so that one check covers both. When a scan got no answer
  # from its advisory service, a pull request or main push only warns: an
  # outage must not stop every merge, and the daily run and a publish
  # still need a verdict.
  supply-chain:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vulnerabilities-*
          path: vulnerabilities
          merge-multiple: true
        # No artifact at all is judged below as missing results.
        continue-on-error: true
      - name: bun audit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun .github/scripts/npm-audit.ts vulnerabilities
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-results
          path: vulnerabilities/
          if-no-files-found: ignore
      - name: Verdict (fails on a fixable high or critical)
        env:
          NO_VERDICT: ${{ contains(fromJSON('["pull_request","push"]'), github.event_name) && !startsWith(github.ref, 'refs/tags/') && 'warn' || 'fail' }}
        run: .github/scripts/supply-chain-verdict.sh vulnerabilities "$NO_VERDICT"

  # Publish path, in stages so a failed verification never leaves a consumable
  # tag behind:
  #   publish  – per image: rebuild from the gha cache, push under a staging
  #              tag scoped to this run, pull the digest back, smoke it
  #   promote  – once all three staged digests passed: refuse if a tag it would
  #              write already names a different digest, then retag the staged
  #              digests (registry-side, no rebuild)
  # Two pairs of jobs run the same steps. `publish` and `promote` are the
  # release: a `push` of a `v*` tag writes vX and sha-… under the `release`
  # environment, where the repository adds required reviewers. `publish-main`
  # and `promote-main` write main-<12> on a push to main, reviewed by the merge
  # itself, so no environment. sha-<12> is not reused there: a build on
  # another day has another digest, and promote would refuse the tag.
  # `workflow_dispatch` can name any ref, so the event is checked as well as
  # the ref. The commit must be on main — a tag is not a review.
  publish:
    needs: [build, supply-chain]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [control-host, worker, egress-proxy]
    steps: &publish-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # `supply-chain` passes a main push whose scan got no answer; publishing
      # still needs the verdict, npm audit of the whole bun.lock included.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: supply-chain-results
          path: supply-chain-results
      - name: Every scan answered
        run: .github/scripts/supply-chain-verdict.sh supply-chain-results fail
      - name: Commit must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main"
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - id: meta
        env:
          APP: ${{ matrix.app }}
          PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          name="${REGISTRY}/$(echo "$PREFIX" | tr '[:upper:]' '[:lower:]')-${APP}"
          echo "name=${name}" >>"$GITHUB_OUTPUT"
          echo "staging=${name}:staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >>"$GITHUB_OUTPUT"
          echo "apt-upgrade-key=$(date -u +%F)" >>"$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          tags: ${{ steps.meta.outputs.staging }}
          push: true
          provenance: false
          cache-from: type=gha,scope=images-${{ matrix.app }}
          build-args: |
            BUN_IMAGE=${{ env.BUN_IMAGE }}
            BUILDKIT_SYNTAX=${{ env.DOCKERFILE_FRONTEND_IMAGE }}
            APT_UPGRADE_KEY=${{ steps.meta.outputs.apt-upgrade-key }}
      - name: Smoke the pushed digest
        env:
          APP: ${{ matrix.app }}
          NAME: ${{ steps.meta.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker pull "${NAME}@${DIGEST}"
          .github/scripts/image-smoke.sh "$APP" "${NAME}@${DIGEST}"
      # The digest that gets promoted, not the build job's image: this job
      # builds again, and the apt layer is not pinned (a build job that ran
      # before UTC midnight upgraded on another key). The licenses must hold,
      # the scan must run, and a fixable high or critical finding stops the
      # publish as it does `supply-chain`.
      - name: Licenses and vulnerabilities of the pushed digest
        timeout-minutes: 10
        env:
          APP: ${{ matrix.app }}
          NAME: ${{ steps.meta.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
          LICENSE_MODE: ${{ github.ref == 'refs/heads/main' && 'publish-main' || 'publish' }}
        run: |
          .github/scripts/image-licenses.sh "$APP" "${NAME}@${DIGEST}" "$LICENSE_MODE"
          .github/scripts/image-scan.sh "$APP" "${NAME}@${DIGEST}" vulnerabilities
          result="$(cat "vulnerabilities/${APP}.txt")"
          if [ "$result" != clean ]; then
            echo "::error::${APP}@${DIGEST}: ${result#found } high or critical with a fix available"
            exit 1
          fi
      - name: Record staged digest
        env:
          APP: ${{ matrix.app }}
          NAME: ${{ steps.meta.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_ID: ${{ steps.push.outputs.imageid }}
        run: |
          base="$(sed -n 's/^ARG BUN_IMAGE=//p' "apps/${APP}/Dockerfile")"
          runtime=null
          if [ "$APP" = worker ]; then
            runtime="$(docker run --rm -i --network none --entrypoint bun \
              "${NAME}@${DIGEST}" run apps/worker/src/image-runtime.ts \
              <<<'{}' | jq -c 'del(.profiles)')"
          fi
          unverified="$(jq -Rn '[inputs]' "unverified-sources/${APP}.txt")"
          mkdir -p staged
          jq -n \
            --arg app "$APP" --arg name "$NAME" --arg base "$base" \
            --arg digest "$DIGEST" --arg imageId "$IMAGE_ID" \
            --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" \
            --argjson runtime "$runtime" --argjson unverified "$unverified" \
            '{app: $app, image: $name, base: $base, pushed: true, promoted: false,
              digest: $digest, imageId: $imageId, commit: $sha, ref: $ref,
              runtime: $runtime, unverifiedSources: $unverified}' \
            | tee "staged/${APP}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-digest-${{ matrix.app }}
          path: staged/${{ matrix.app }}.json
          if-no-files-found: error

  promote:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # One promotion at a time across the whole repository: two v* tags on the
    # same commit share the sha-<12> tag, and the check-then-write below is
    # only safe when no other promotion runs between the check and the write.
    concurrency:
      group: images-promote
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      packages: write
    steps: &promote-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: staged-digest-*
          path: staged
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The tags depend on the run: vX and sha-… for a tag, main-<12> for
      # main. The set-level commit point consumers resolve through (a release
      # manifest) is D5; until then it is the artifact below.
      - name: Promote staged digests
        run: .github/scripts/image-promote.sh staged digests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digests-published
          path: digests/*.json
          if-no-files-found: error

  publish-main:
    needs: [build, supply-chain]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [control-host, worker, egress-proxy]
    steps: *publish-steps

  # No job-level concurrency: main-<12> belongs to one commit and the workflow
  # group already runs one run per commit. Sharing `images-promote` would let
  # a queued merge replace another's pending promotion.
  promote-main:
    needs: publish-main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps: *promote-steps

  # The chart of a promoted image set. Like publish and promote, a pair per
  # event, each with its own `needs`: one job needing both would be skipped
  # along with the path that did not run.
  #   chart          package with the digests the promotion just read back,
  #                  install that package on kind and reach /readyz, all
  #                  without package write: a chart that cannot install is
  #                  not published
  #   chart-publish  push the package and read it back with no login
  chart:
    needs: promote
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps: &chart-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
      - &helm-tool
        name: helm
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz -C bin --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: kind and kubectl
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo bin/kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  bin/kind" | sha256sum -c -
          curl -fsSLo bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  bin/kubectl" | sha256sum -c -
          chmod +x bin/kind bin/kubectl
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-digests-published
          path: published
      - name: Package the chart with this run's images
        run: bun .github/scripts/chart-package.ts published chart-out
      # The chart runs no worker on an empty install, so kind alone would not
      # notice a worker digest nobody can pull. No job here has logged in.
      - name: Every image reads without a login
        run: |
          for file in published/*.json; do
            ref="$(jq -r '"\(.image)@\(.digest)"' "$file")"
            docker manifest inspect "$ref" >/dev/null
            echo "read ${ref}"
          done
      - name: Install the package on kind
        env:
          CLUSTER_NAME: chart-check
          STATE_DIR: ${{ runner.temp }}/kind
          KIND_NODE_IMAGE: ghcr.io/jeongjaesoon/agent-platform-ci/kind-node@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          REGISTRY_IMAGE: ghcr.io/jeongjaesoon/agent-platform-ci/registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        run: |
          CHART_PACKAGE="$(ls "$PWD"/chart-out/werft-*.tgz)" KIND_IMAGE_MIRROR="${BUN_IMAGE%/*}" deploy/kind/up.sh
      - if: failure()
        name: Why the install stopped
        env:
          KUBECONFIG: ${{ runner.temp }}/kind/kubeconfig
        run: |
          kubectl -n werft get jobs,deploy,pods -o wide || true
          kubectl -n werft get events --sort-by=.lastTimestamp || true
      - if: '!cancelled()'
        name: Nothing pulled from Docker Hub
        run: .github/scripts/assert-no-docker-hub-images.sh docker
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart
          path: chart-out/
          if-no-files-found: error

  chart-main:
    needs: promote-main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps: *chart-steps

  chart-publish:
    needs: chart
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      packages: write
    steps: &chart-publish-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *helm-tool
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chart
          path: chart-out
      - name: Push the chart and read it back without a login
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          .github/scripts/chart-push.sh chart-out/werft-*.tgz \
            "${REGISTRY}/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"

  chart-publish-main:
    needs: chart-main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps: *chart-publish-steps

  # The daily run's failed verdict as an issue: nobody watches a scheduled
  # run, and a PR's findings are already in its own checks. A manual run
  # reports too, so the path can be exercised on demand.
  vulnerability-report:
    needs: [build, supply-chain]
    if: always() && contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && needs.supply-chain.result != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: supply-chain-results
          path: vulnerabilities
        continue-on-error: true
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "<!-- ci-supply-chain -->"
            echo "The daily supply-chain check on \`${GITHUB_SHA}\` ([run ${GITHUB_RUN_ID}](${RUN_URL})) found high or critical vulnerabilities with a fix available, or could not scan."
            echo
            echo "| scan | result |"
            echo "| --- | --- |"
            for scan in control-host worker egress-proxy npm; do
              echo "| ${scan} | $(cat "vulnerabilities/${scan}.txt" 2>/dev/null || echo "no result") |"
            done
            echo
            echo "Each finding is in the run summary and the \`supply-chain-results\` artifact. Update the package or base image, or record an exception with its reason and expiry in \`.github/vulnerability-exceptions.json\` (docs/operator/images-and-supply-chain.md § 공급망 취약점 정책). Until then every pull request's \`supply-chain\` check fails too. Close this issue once handled; the next finding opens a new one."
          } >body.md
          .github/scripts/upsert-ci-issue.sh ci-supply-chain \
            "Supply chain: fixable high or critical vulnerabilities" body.md
