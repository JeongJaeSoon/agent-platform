name: Supply chain

# Known vulnerabilities in the npm dependencies (94S-338). Apart from ci.yml on
# purpose: `bun audit` asks the npm advisory service, and a live service must
# not make the required `check` flaky. Nothing here is a required check.
#
# A pull request fails this run on a high or critical advisory. The daily run
# opens or appends to an issue instead (the 94S-238 way): an advisory
# published overnight belongs to no pull request, and the issue is where it
# is seen. The images' OS packages are scanned in images.yml.
on:
  pull_request:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
      # The whole bun.lock, dev dependencies included: `bun audit` reads the
      # lockfile, not node_modules, and has no production filter; a
      # compromised build tool is a supply-chain problem too. Its exit code
      # is 1 both for advisories and for a request that failed, so the
      # verdict comes from the JSON: no JSON means the advisory service did
      # not answer. That fails no pull request, but the daily run reports it.
      - name: bun audit (fails at high)
        run: |
          bun audit --json >audit.json 2>audit.err || true
          if ! jq -e 'type == "object"' audit.json >/dev/null 2>&1; then
            cat audit.err
            echo "::warning::bun audit got no answer from the advisory service; no verdict"
            [ "$GITHUB_EVENT_NAME" = pull_request ] && exit 0
            exit 1
          fi
          jq -r 'keys[] as $name | .[$name][]
            | "\(.severity)\t\($name) \(.vulnerable_versions)\t\(.url)"' audit.json
          high="$(jq '[.[][] | select(.severity == "high" or .severity == "critical")] | length' audit.json)"
          echo "--- ${high} high or critical"
          if [ "$high" -gt 0 ]; then
            echo "::error::${high} high or critical npm advisories"
            exit 1
          fi

  # Only off pull requests, where no one watches the run: the failure becomes
  # an issue. Its own job so that the audit never holds a token that writes.
  report:
    needs: audit
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "<!-- ci-dependency-audit -->"
            echo "\`bun audit\` found a high or critical advisory, or got no answer from the advisory service, on \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA}\` (${GITHUB_EVENT_NAME}, [run ${GITHUB_RUN_ID}](${RUN_URL}))."
            echo
            echo "The run's log lists each advisory with its severity and link. Update the dependency, or, if it does not apply, exclude its advisory from the count in supply-chain.yml with the reason next to it. Close this issue once handled; the next failure opens a new one."
          } >body.md
          .github/scripts/upsert-ci-issue.sh ci-dependency-audit \
            "Supply chain: high or critical npm advisory" body.md
