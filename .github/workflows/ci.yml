name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sessions
          POSTGRES_PASSWORD: dev
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sessions"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      QUEUE_DATABASE_URL: postgresql://postgres:dev@127.0.0.1:5432/sessions
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun install --cwd spikes/94s-91 --frozen-lockfile
      - run: uv tool install 'litellm[proxy]==1.100.1'
      - run: bun run --cwd spikes/94s-91 probe:version
      - run: bun run --cwd spikes/94s-91 check
