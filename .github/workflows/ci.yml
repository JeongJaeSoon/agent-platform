name: CI

on:
  # Only main needs a push run: every other branch is covered by its pull
  # request, and listening to both events ran each PR commit twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: no service containers, no opt-in variables, so every
  # integration test deliberately skips here and runs in `integration`.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun-setup
        with:
          save-cache: "true"
      - run: bun install --frozen-lockfile
      - run: bun run check

  # The same suite with every opt-in variable on, so `bun run test` reports
  # zero skips. Filtering by file name would miss opt-in tests that do not
  # follow the *.integration.test.ts convention.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sessions
          POSTGRES_PASSWORD: dev
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sessions"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      localstack:
        image: localstack/localstack:3
        env:
          SERVICES: s3
          AWS_DEFAULT_REGION: ap-northeast-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_ENDPOINT_URL: http://127.0.0.1:4566
      AWS_REGION: ap-northeast-1
      AWS_SECRET_ACCESS_KEY: test
      # ubuntu runners ship a Docker daemon: run the LocalDockerBackend
      # integration tests against it (busybox) instead of skipping them.
      DOCKER_BACKEND_TEST: "1"
      QUEUE_DATABASE_URL: postgresql://postgres:dev@127.0.0.1:5432/sessions
      S3_BUCKET: claude-sessions
      STORAGE_LOCALSTACK_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun-setup
      - run: bun install --frozen-lockfile
      - run: bun run test
      # Not a *.test.ts file, so `bun test` never picks it up on its own.
      - run: bun test ./apps/api/src/server.integration.ts

  # Research harnesses, pinned to the SDK and LiteLLM versions under
  # investigation. Their failures have never been a product regression, so they
  # report without blocking the run; see README § CI.
  spikes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    services:
      localstack:
        image: localstack/localstack:3
        env:
          SERVICES: s3
          AWS_DEFAULT_REGION: ap-northeast-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_ENDPOINT_URL: http://127.0.0.1:4566
      AWS_REGION: ap-northeast-1
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET: claude-sessions
      SESSION_STORE_LOCALSTACK_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun-setup
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      # Both spikes typecheck across ../../packages/contracts, so they need the
      # root workspace installed as well as their own lockfile.
      - run: bun install --frozen-lockfile
      - run: bun install --cwd spikes/94s-91 --frozen-lockfile
      - run: bun install --cwd spikes/94s-92 --frozen-lockfile
      - run: uv tool install 'litellm[proxy]==1.100.1'
      - run: bun run --cwd spikes/94s-91 probe:version
      - name: spikes/94s-91 check
        run: .github/scripts/retry-flaky.sh 2 'spikes/94s-91 check' bun run --cwd spikes/94s-91 check
      # The two spikes are independent investigations: one failing must not
      # hide the other's result.
      - name: spikes/94s-92 check
        if: '!cancelled()'
        run: .github/scripts/retry-flaky.sh 2 'spikes/94s-92 check' bun run --cwd spikes/94s-92 check
