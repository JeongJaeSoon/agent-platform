name: CI

on:
  # Listening to push on every branch as well as pull_request ran each PR commit
  # twice. A branch with no pull request now gets no automatic run, so
  # workflow_dispatch is here to cover that case on demand. Tag pushes are not
  # built; the tagged tree already ran as a main push.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: 'Which job to run. Anything but `all` skips the rest — use it when a manual run only needs one of them.'
        type: choice
        required: false
        default: all
        options: [all, check, integration, workspace-quota, e2e, quickstart, helm-chart, k8s-smoke, agent-sdk-compat, storybook, docs, ui-pack]
      allow_parallel:
        description: 'Allow independent parallel manual runs for deliberate flake testing (uses extra minutes)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # `github.event.inputs.*`, not `inputs.*`: a dispatch through the API sends
  # input values as strings, so a declared boolean arrives as the *string*
  # "false", which `!inputs.allow_parallel` reads as truthy — silently turning
  # the default into independent parallel runs.
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.event.inputs.allow_parallel != 'true' && format('{0}-{1}', github.ref, github.sha)) || github.run_id }}
  cancel-in-progress: true

jobs:
  # Fast feedback: no service containers and no opt-in variables, so the tests
  # gated on those skip here and run in `integration`. Suites that need nothing
  # external — the SDK adapter against a local fake Messages API, for one — do
  # run here despite the `integration` in their file names.
  #
  # Split by role across runners: `bun run check` ran typecheck, lint
  # and the suite one after another in 5m10s (1m, 1s and 4m10s), which made it
  # the longest path of every PR run. Each part is now its own job, and the
  # suite is cut once more along the repo layout — packages/ in one part,
  # everything else in the other — because one bun process over it was still
  # longer than the integration shards. The parts are names, not numbers: a red
  # `check (lint)` says what broke without opening the log.
  check-part:
    name: check (${{ matrix.part }})
    # A non-dispatch event has no `only`, so it reads as `all`.
    if: contains(fromJSON('["all","check"]'), github.event.inputs.only || 'all')
    # Pinned rather than ubuntu-latest: GitHub moves that alias to the next
    # LTS image on its own schedule, which lands as an unrelated CI break in
    # whatever PR is open that day.
    runs-on: ubuntu-24.04
    # Ceiling just above the slowest part: the old single job's worst was 6m.
    timeout-minutes: 6
    strategy:
      # Each part's failures are its own; a cancelled part would hide them
      # until the next push.
      fail-fast: false
      matrix:
        include:
          - part: typecheck
          - part: lint
          # THIRD_PARTY_NOTICES.md against bun.lock: a dependency
          # added without regenerating the notices, or one under a license
          # nobody reviewed, fails the required check. Offline by design.
          - part: licenses
          - part: "unit: packages"
            unit: packages
          # apps/worker/ and apps/web/ apart from the rest of apps/ and
          # tests/: as one part they ran about 5m of the 6m ceiling.
          - part: "unit: worker, web"
            unit: worker-web
          # The complement of the two above: the other apps, tests/, and any
          # other directory the `test` script's filters pick up.
          - part: "unit: other apps, tests"
            unit: rest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
        with:
          # One writer per cache scope; the other parts restore what it saved.
          save-cache: ${{ matrix.part == 'typecheck' }}
      - run: bun install --frozen-lockfile
      - if: matrix.part == 'typecheck'
        run: bun run typecheck
      - if: matrix.part == 'lint'
        run: bun run lint
      - if: matrix.part == 'licenses'
        run: bun scripts/third-party-notices.ts --check
      - if: matrix.unit
        name: Tests of this part
        env:
          UNIT: ${{ matrix.unit }}
        # An assignment, not process substitution, so a planner failure fails
        # the step instead of handing `bun test` an empty list — which it
        # would read as the whole suite.
        run: |
          files=$(bun .github/scripts/unit-part.ts "$UNIT")
          mapfile -t files <<<"$files"
          bun test "${files[@]}"

  # The required check, for the same reason as `integration` below: branch
  # protection names `check`, the matrix reports one context per part, and a
  # skipped required check counts as passing. So it runs on `always()` and
  # fails on anything but `success` from every part.
  check:
    needs: check-part
    if: >-
      always()
      && contains(fromJSON('["all","check"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULT: ${{ needs.check-part.result }}
        run: |
          echo "check parts: $RESULT"
          [ "$RESULT" = success ]

  # The same suite with the opt-in variables on, so the tests gated on
  # PostgreSQL, LocalStack or the Docker daemon run instead of skipping.
  # Filtering by file name would miss opt-in tests that do not follow the
  # *.integration.test.ts convention, so every file of `bun run test` runs in
  # exactly one of these jobs.
  #
  # One job per domain, each on its own VM with only the services its
  # files need: a job that needs no LocalStack does not wait ~40s for one. The
  # `paths` below are prefixes of repo-relative paths and the only record of
  # which job runs which file; .github/scripts/integration-jobs.ts reads them
  # from here and fails every job when a file belongs to no job or to two.
  # After the run the same script fails the job on any skip it does not
  # declare — a file placed in a job without the service it needs skips its
  # tests rather than failing them, and that must not pass as green.
  #
  # The jobs start alongside `check` instead of after it. Waiting on `check`
  # only saved runner minutes on a red run, and a public repository does not
  # pay for those; it cost every green PR the whole of `check` in wall time.
  integration-domain:
    name: integration (${{ matrix.domain }})
    if: contains(fromJSON('["all","integration"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    # The longest domain, DB, reached 5m42s on main and 4m55s on the PR.
    # Allow 10m for runner variability, service startup and cleanup.
    timeout-minutes: 10
    strategy:
      # A failing job must not cancel the rest: each one's failures are
      # their own, and a cancelled job would hide them until the next push.
      fail-fast: false
      matrix:
        # `docker` means the runner's own daemon, not a service container.
        include:
          # The PostgreSQL stores and the queue: unit and integration suites.
          - domain: db
            postgres: true
            localstack: false
            docker: false
            paths:
              - packages/db/
              - packages/testkit/src/postgres.
          # HTTP routes and the control-host flows they drive. Keep their
          # database and lifecycle checks apart from API consumer suites.
          - domain: api
            postgres: true
            localstack: true
            docker: false
            paths:
              - apps/control-host/src/api/
              - apps/control-host/src/main
              - apps/control-host/src/pass-loop/
              - apps/control-host/src/reconciler/
              - tests/catalog-mismatch.
              - tests/context-gap-flow.
              - tests/drain-park-flow.
              - tests/interrupt-flow.
              - tests/lease-clock.
          # Slack and the contracts, clients and web apps that consume the API.
          # Enable PostgreSQL and LocalStack so service-gated tests do not skip.
          - domain: surface
            postgres: true
            localstack: true
            docker: false
            paths:
              - apps/control-host/src/slack/
              - packages/contracts/
              - packages/client/
              - packages/sdk/
              - packages/core/
              - packages/react/
              - apps/web/
              - apps/storybook/
          # Object storage: checkpoint objects, the S3 transport and its bounds.
          - domain: storage
            postgres: false
            localstack: true
            docker: false
            paths:
              - packages/storage/
              - packages/testkit/src/localstack.
              - tests/checkpoint-flow.
              - tests/checkpoint-pins.
              - tests/object-store-cli.
              - tests/object-store-route.
              - tests/test-ops.
              - tests/worker-checkpoint-publish.
            skips:
              # skipIf(linux): the runner can enforce the limits.
              - file: packages/storage/src/git-runner.test.ts
                test: where limits cannot be enforced git still runs, and says so once
          # Worker containers: the local-docker backend and its workspaces,
          # the scheduler that drives it, and the images and compose they run
          # as. Files are listed one by one under local-docker/src so that the
          # egress suite can be a job of its own.
          - domain: docker
            postgres: true
            localstack: false
            docker: true
            paths:
              - apps/control-host/src/scheduler/
              - packages/adapters/execution/local-docker/src/backend.
              - packages/adapters/execution/local-docker/src/config.
              - packages/adapters/execution/local-docker/src/docker-client.
              - packages/adapters/execution/local-docker/src/workspace
              - tests/backup-restore.
              - tests/images.
              - tests/scheduler-launch-claim.
          # What a worker may reach: the egress proxy and the isolated worker
          # networks. Split from `docker` because its suite alone runs ~70s,
          # most of it pulling the LocalStack image it starts as a container.
          - domain: egress
            postgres: false
            localstack: false
            docker: true
            paths:
              - apps/egress-proxy/
              - packages/adapters/execution/local-docker/src/egress.
              - tests/credential-routes.
              - tests/sdk-egress-proxy.
          # What runs inside a worker, none of it needing a service: the worker
          # process, runtime adapters, platform services — plus the UI component
          # library and the repository's own tooling suites, which need no
          # service either and are too small for a runner of their own.
          - domain: worker
            postgres: false
            localstack: false
            docker: false
            paths:
              - apps/worker/
              - packages/adapters/execution/kubernetes/
              - packages/adapters/runtimes/
              - packages/observability/
              - packages/platform/
              - packages/runtime-core/
              - packages/system/
              - packages/ui/
              - packages/testkit/src/fake-anthropic.
              - packages/testkit/src/fake-github.
              - packages/testkit/src/scripted-messages.
              - packages/testkit/src/workspace.
              - tests/agent-sdk-compat/
              - tests/architecture.
              - tests/ci-images.
              - tests/ci-services.
              - tests/d2-gate/
              - tests/docs-links.
              - tests/e2e/local-model.
              - tests/e2e/real-model.
              - tests/soak/
              - tests/ci-issue-scripts.
              - tests/integration-jobs.
              - tests/local-sh.
              - tests/preview-reap.
              - tests/supply-chain.
              - tests/test-files.
              - tests/third-party-notices.
              - tests/ui-release.
              - tests/unit-part.
              - tests/verify-stack.
            skips:
              # The Kubernetes backend's suites need a kind cluster
              # (K8S_BACKEND_TEST=1 and a KUBECONFIG); the job that brings one
              # is 94S-525. (unnamed) is their beforeAll/afterAll.
              - file: packages/adapters/execution/kubernetes/src/backend.integration.test.ts
                test: "(unnamed)"
              - file: packages/adapters/execution/kubernetes/src/backend.integration.test.ts
                test: "a delete conditioned on the replaced Pod's UID leaves the replacement running"
              - file: packages/adapters/execution/kubernetes/src/backend.integration.test.ts
                test: "a failed worker reports its exit, reason and log tail"
              - file: packages/adapters/execution/kubernetes/src/backend.integration.test.ts
                test: "terminating one generation leaves the next generation's Pod untouched"
              - file: packages/adapters/execution/kubernetes/src/backend.integration.test.ts
                test: "the nonce is in the Pod's own Secret only, never in the Pod"
              - file: packages/adapters/execution/kubernetes/src/backend.integration.test.ts
                test: "terminate and workspace removal leave no Pod, Secret or PVC of the session"
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: "(unnamed)"
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: "ensureExecution twice → one resource, adopted without a new nonce"
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: "inspect: found:false for nothing launched, running for a launch"
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: "listManaged returns what was launched and drops what was terminated"
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: "terminate: generation_mismatch, terminated, absent — only the matching generation"
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: "a resource removed out of band is re-created; terminate conditioned on the old providerRef leaves the replacement"
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: "a resource launched with another spec is refused with LaunchSpecMismatchError and left in place"
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: "workspace pair, when present: lists the session's workspace and removes it only once unused"
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: "assertReplaceable, when present: resolves for a launchable intent and launches nothing"
              - file: packages/adapters/execution/kubernetes/src/backend.contract.integration.test.ts
                test: "reconcileNetworks, when present: clears what an out-of-band removal left, then has nothing to do"
              # The D2 gate needs the whole compose stack and the
              # images built from the checkout; scripts/d2-gate/run.sh runs it.
              # (unnamed) is its beforeAll/afterAll.
              - file: tests/d2-gate/gate.e2e.test.ts
                test: "(unnamed)"
              - file: tests/d2-gate/gate.e2e.test.ts
                test: "A: two turns on one engine, checkpoint, restore onto a clean worker"
              - file: tests/d2-gate/gate.e2e.test.ts
                test: "B: a publish that fails at the manifest is never promoted"
              - file: tests/d2-gate/gate.e2e.test.ts
                test: "C: a transcript mirror error blocks the checkpoint and new input"
              - file: tests/d2-gate/gate.e2e.test.ts
                test: "D: a worker that loses its lease mid-turn promotes nothing"
              - file: tests/d2-gate/gate.e2e.test.ts
                test: "E: an accepted interrupt stops its turn, however early it lands"
              # sweep on the same stack; run against a stack kept by
              # D2_GATE_UP_ONLY=1 scripts/d2-gate/run.sh.
              - file: tests/d2-gate/reconciler-sweep.e2e.test.ts
                test: "(unnamed)"
              - file: tests/d2-gate/reconciler-sweep.e2e.test.ts
                test: "R1: a worker whose heartbeat stopped is fenced by the periodic pass and its turn settled unknown"
              - file: tests/d2-gate/reconciler-sweep.e2e.test.ts
                test: "R2: an interrupt its heartbeating worker cannot settle is sent to terminate and its receipt ends unknown"
              # control host roles, on the same kept stack.
              - file: tests/d2-gate/control-host-roles.e2e.test.ts
                test: "(unnamed)"
              - file: tests/d2-gate/control-host-roles.e2e.test.ts
                test: "H1: one image runs the three roles and only the scheduler holds the Docker socket"
              - file: tests/d2-gate/control-host-roles.e2e.test.ts
                test: "H2: a scheduler restarted mid-turn ends no worker and launches none twice"
              - file: tests/d2-gate/control-host-roles.e2e.test.ts
                test: "H3: the api and reconciler come back from a restart and the session takes its next turn"
              - file: tests/d2-gate/control-host-roles.e2e.test.ts
                test: "H4: with PostgreSQL down the loops fail their passes, and recover once it is back"
              - file: tests/d2-gate/control-host-roles.e2e.test.ts
                test: "H5: a scheduler without Docker reserves nothing, and the real one launches the waiting session once"
    # Every third-party image in this workflow comes from ghcr.io, not Docker
    # Hub, pinned by its upstream digest: ci-image-mirror.yml copies it there
    # . These point the suites that pull their own images at it
    # instead of their Docker Hub defaults; unused where no daemon runs.
    env:
      BUN_TEST_IMAGE: ghcr.io/jeongjaesoon/agent-platform-ci/bun@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
      DOCKER_BACKEND_TEST_HELPER_IMAGE: ghcr.io/jeongjaesoon/agent-platform-ci/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      DOCKER_BACKEND_TEST_IMAGE: ghcr.io/jeongjaesoon/agent-platform-ci/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      EGRESS_CURL_TEST_IMAGE: ghcr.io/jeongjaesoon/agent-platform-ci/curl@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
      EGRESS_PROXY_TEST_IMAGE: ghcr.io/jeongjaesoon/agent-platform-ci/bun@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
      EXECUTION_WORKSPACE_MIGRATION_IMAGE: ghcr.io/jeongjaesoon/agent-platform-ci/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      LOCALSTACK_TEST_IMAGE: ghcr.io/jeongjaesoon/agent-platform-ci/localstack@sha256:b279c01f4cfb8f985a482e4014cabc1e2697b9d7a6c8c8db2e40f4d9f93687c7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Not `services:`, which the runner starts one by one before the first
      # step and polls on a 2·4·8s backoff (46s for api). From here the pulls
      # overlap each other and the install below; `wait` then probes every
      # second, and fails with the container's log if one never gets ready.
      - if: matrix.postgres || matrix.localstack
        env:
          POSTGRES: ${{ matrix.postgres }}
          LOCALSTACK: ${{ matrix.localstack }}
          POSTGRES_SERVICE_IMAGE: ghcr.io/jeongjaesoon/agent-platform-ci/postgres@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
          LOCALSTACK_SERVICE_IMAGE: ghcr.io/jeongjaesoon/agent-platform-ci/localstack@sha256:b279c01f4cfb8f985a482e4014cabc1e2697b9d7a6c8c8db2e40f4d9f93687c7
        run: .github/scripts/ci-services.sh start
      - uses: ./.github/actions/bun-setup
      - run: bun install --frozen-lockfile
      # Unset rather than empty where the service is absent: a test reading
      # `?? default` would take an empty string as a value.
      - name: Opt-in variables of this job's services
        env:
          POSTGRES: ${{ matrix.postgres }}
          LOCALSTACK: ${{ matrix.localstack }}
          DOCKER: ${{ matrix.docker }}
        run: |
          {
            if [ "$POSTGRES" = true ]; then
              echo "QUEUE_DATABASE_URL=postgresql://postgres:dev@127.0.0.1:5432/sessions"
            fi
            if [ "$LOCALSTACK" = true ]; then
              echo "AWS_ACCESS_KEY_ID=test"
              echo "AWS_ENDPOINT_URL=http://127.0.0.1:4566"
              echo "AWS_REGION=ap-northeast-1"
              echo "AWS_SECRET_ACCESS_KEY=test"
              echo "S3_BUCKET=claude-sessions"
              echo "STORAGE_LOCALSTACK_TEST=1"
            fi
            # ubuntu runners ship a Docker daemon: run the LocalDockerBackend
            # integration tests against it (busybox) instead of skipping them.
            if [ "$DOCKER" = true ]; then
              echo "DOCKER_BACKEND_TEST=1"
            fi
          } >>"$GITHUB_ENV"
      # A Docker call that stalls on the runner leaves nothing behind once the
      # VM is gone, and the client only sees its own timeout. The
      # daemon's events say whether the container got as far as starting; the
      # step after the tests keeps them, with the daemon's log, when it fails.
      - if: matrix.docker
        name: Record the daemon's events
        run: |
          echo "DOCKER_EVENTS_SINCE=$(date -u '+%Y-%m-%d %H:%M:%S')" >>"$GITHUB_ENV"
          nohup docker events --format '{{json .}}' >"$RUNNER_TEMP/docker-events.jsonl" 2>&1 &
      - if: matrix.postgres || matrix.localstack
        env:
          POSTGRES: ${{ matrix.postgres }}
          LOCALSTACK: ${{ matrix.localstack }}
        run: .github/scripts/ci-services.sh wait
      - name: Tests of this domain
        env:
          DOMAIN: ${{ matrix.domain }}
        # An assignment, not process substitution, so a failed assignment
        # fails the step instead of handing `bun test` an empty list — which it
        # would read as the whole suite.
        run: |
          files=$(bun .github/scripts/integration-jobs.ts files "$DOMAIN")
          mapfile -t files <<<"$files"
          bun test --reporter=junit --reporter-outfile="$RUNNER_TEMP/junit.xml" "${files[@]}"
          bun .github/scripts/integration-jobs.ts verify "$DOMAIN" "$RUNNER_TEMP/junit.xml"
      # Whatever the suites pulled, by whatever path: none of it from Docker
      # Hub. Also after a failure — such a pull is worth knowing about anyway.
      - if: '!cancelled()'
        name: Nothing pulled from Docker Hub
        run: .github/scripts/assert-no-docker-hub-images.sh docker
      # SIGUSR1 makes dockerd write every goroutine's stack, so a call still
      # stuck when the tests gave up shows where it is waiting.
      - if: failure() && matrix.docker
        name: Keep the daemon's record of a failed run
        run: |
          sudo kill -USR1 "$(pidof dockerd)" || true
          sleep 2
          sudo journalctl -u docker -u containerd --since "$DOCKER_EVENTS_SINCE" --no-pager -o short-iso-precise >"$RUNNER_TEMP/docker-daemon.log" || true
          sudo sh -c "cp /var/run/docker/goroutine-stacks-*.log '$RUNNER_TEMP/' 2>/dev/null" || true
          sudo chmod a+r "$RUNNER_TEMP"/docker-* "$RUNNER_TEMP"/goroutine-stacks-*.log 2>/dev/null || true
      - if: failure() && matrix.docker
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-daemon-${{ matrix.domain }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/docker-events.jsonl
            ${{ runner.temp }}/docker-daemon.log
            ${{ runner.temp }}/goroutine-stacks-*.log
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        run: .github/scripts/ci-services.sh stop

  # The required check. Branch protection names `integration`, and a matrix
  # reports one context per job, so this job stands in for all of them:
  # green only when every domain passed. A skipped required check counts as
  # passing, so this must never skip once the domains were meant to run:
  # `always()`, not the default (which skips after a failed domain) nor
  # `!cancelled()` (which skips when the run is cancelled after a domain has
  # already failed). Anything but `success` fails — a failed, cancelled,
  # timed-out or skipped domain.
  integration:
    needs: integration-domain
    if: >-
      always()
      && contains(fromJSON('["all","integration"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULT: ${{ needs.integration-domain.result }}
        run: |
          echo "integration domains: $RESULT"
          [ "$RESULT" = success ]

  # apps/storybook: the static build, then every story rendered in Chrome,
  # failing on any axe violation (`a11y.test: "error"` in its preview). A
  # story-less component is caught earlier, by apps/storybook's bun suite.
  storybook:
    if: contains(fromJSON('["all","storybook"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
      # The Storybook and Vitest CLIs run on Node; pinned, not the image's own.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Static build
        run: bun run --cwd apps/storybook build
      # Playwright drives the runner's installed Chrome (vitest.config.ts), so
      # nothing is downloaded here.
      - name: Every story, with the a11y check
        run: bun run --cwd apps/storybook test:stories
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-dist
          path: apps/storybook/dist
          retention-days: 1

  # apps/docs: the Fumadocs site, a Next.js static export. Its own job so a
  # docs-only change does not wait on the story run, and the other way round.
  docs:
    if: contains(fromJSON('["all","docs","storybook"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
      # next build runs on Node; pinned, not the image's own.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Static build
        run: bun run --cwd apps/docs build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-out
          path: apps/docs/out
          retention-days: 1

  # packages/ui as an outside app gets it: the built package, packed, installed
  # from the tarball into an empty Vite + React app with no Tailwind, which
  # must type-check with skipLibCheck off, build, and render a styled Button in
  # the runner's Chrome. Nothing is published.
  ui-pack:
    if: contains(fromJSON('["all","ui-pack"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
      # The consumer's toolchain is npm's, as an outside app's would be.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The consumer pins its direct dependencies in the script, so the
      # script is the key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ui-pack-npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ui-pack-smoke.ts') }}
          restore-keys: ui-pack-npm-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - name: Build the package
        run: bun run --cwd packages/ui build:package
      - name: Files the tarball would carry
        run: npm pack --dry-run ./packages/ui/dist
      - name: Install, type-check, build and render in an empty app
        run: bun scripts/ui-pack-smoke.ts --screenshot "$RUNNER_TEMP/ui-pack-button.png"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-pack-button
          path: ${{ runner.temp }}/ui-pack-button.png
          retention-days: 7

  # Assembled on every run so a PR proves the layout the deploy will get: the
  # docs site at the root, Storybook and the Scalar reference beside it.
  # docs/api/index.html embeds the spec and loads ./scalar.js beside it;
  # openapi.json rides along as the downloadable copy.
  pages:
    needs: [docs, storybook]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-out
          path: _site
      # The docs build owns the root; a docs page at /api or /storybook would
      # be silently merged with or replaced by the sibling below.
      - name: Siblings are free in the docs build
        run: |
          for sibling in _site/api _site/storybook; do
            if [ -e "$sibling" ]; then
              echo "::error::apps/docs produced $sibling, which the Pages site reserves"
              exit 1
            fi
          done
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: storybook-dist
          path: _site/storybook
      - name: Pages site
        run: |
          mkdir -p _site/api
          cp docs/api/index.html docs/api/scalar.js docs/openapi.json _site/api/
          ls _site _site/api _site/storybook
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # Publishes the site assembled above to GitHub Pages. Main pushes only: a PR or a
  # feature-branch run never deploys, and is the only job here that may write
  # to Pages. Gated on the PAGES_ENABLED repo variable: with Pages off,
  # deploy-pages answers 404 and turns main red.
  storybook-pages:
    needs: pages
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push'
      && vars.PAGES_ENABLED == 'true'
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The only place the workspace byte ceiling can actually be exercised. The
  # `local` volume driver honours `size` only when the storage under the
  # daemon can carry a project quota, and neither daemon the repo otherwise
  # runs on can: Docker Desktop's kernel has no XFS quota support, and this
  # runner's own data root is on ext4. So the job builds one that can — xfs
  # with prjquota on a loop file, handed to a nested daemon as its data root —
  # and points the workspace suite at it. Everywhere else that suite asserts
  # the other half of the contract: refusing to start rather than running
  # unbounded.
  workspace-quota:
    needs: check
    if: >-
      !cancelled() && needs.check.result != 'failure'
      && contains(fromJSON('["all","workspace-quota"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
      - run: bun install --frozen-lockfile
      - name: Project-quota filesystem
        run: |
          command -v mkfs.xfs >/dev/null || {
            sudo apt-get update && sudo apt-get install -y xfsprogs
          }
          sudo truncate -s 8G /xfs.img
          sudo mkfs.xfs -q /xfs.img
          sudo mkdir -p /mnt/xfs
          sudo mount -o loop,prjquota /xfs.img /mnt/xfs
          # Fail here rather than three steps later with a confusing 400.
          mount | grep -q 'on /mnt/xfs .*prjquota'
      - name: Daemon on that filesystem
        run: |
          mkdir -p /tmp/apq
          docker run -d --privileged --name apq \
            -e DOCKER_TLS_CERTDIR= \
            -v /mnt/xfs:/var/lib/docker \
            -v /tmp/apq:/sock \
            ghcr.io/jeongjaesoon/agent-platform-ci/docker@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac \
            --host=unix:///sock/docker.sock
          for _ in $(seq 1 60); do
            docker exec apq docker version >/dev/null 2>&1 && break
            sleep 2
          done
          sudo chmod 666 /tmp/apq/docker.sock
          docker exec apq docker info --format 'driver={{.Driver}} root={{.DockerRootDir}}'
          # Prove the capability before any test claims to have used it.
          docker exec apq docker volume create --driver local --opt size=64m apq-probe
          docker exec apq docker volume rm apq-probe
      # The scheduler runs the inode helper from the worker image.
      # Building all of that here would spend minutes on the SDK closure for
      # one apt package, so this is the worker's own pinned base (from the
      # mirror; tests/ci-images.test.ts holds it to the Dockerfile's digest)
      # with the same xfsprogs and the same declared VOLUME; image-smoke.sh
      # checks the real worker image carries the tools.
      - name: Inode helper image on that daemon
        run: |
          printf '%s\n' \
            "FROM ghcr.io/jeongjaesoon/agent-platform-ci/bun@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4" \
            "RUN apt-get update && apt-get install -y --no-install-recommends xfsprogs && rm -rf /var/lib/apt/lists/*" \
            'VOLUME ["/workspace"]' \
            | docker exec -i apq docker build -q -t ap-inode-helper:ci -
      - name: Workspace suite against a quota-capable daemon
        env:
          DOCKER_BACKEND_TEST: "1"
          DOCKER_BACKEND_TEST_HELPER_IMAGE: ap-inode-helper:ci
          DOCKER_BACKEND_TEST_IMAGE: ghcr.io/jeongjaesoon/agent-platform-ci/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          DOCKER_HOST: unix:///tmp/apq/docker.sock
          EXECUTION_WORKSPACE_MIGRATION_IMAGE: ghcr.io/jeongjaesoon/agent-platform-ci/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        run: >-
          bun test
          packages/adapters/execution/local-docker/src/workspace.integration.test.ts
          packages/adapters/execution/local-docker/src/workspace-migration.integration.test.ts
      # Both daemons: the runner's holds the dind image, the nested one what
      # the suite pulled.
      - if: '!cancelled()'
        name: Nothing pulled from Docker Hub
        run: |
          .github/scripts/assert-no-docker-hub-images.sh docker
          .github/scripts/assert-no-docker-hub-images.sh env DOCKER_HOST=unix:///tmp/apq/docker.sock docker
      # The daemon's own log is where a create that the suite could not
      # explain shows up. `|| true` because this step also runs when an
      # earlier one failed before the container existed.
      - if: always()
        run: |
          docker logs apq 2>&1 | tail -40 || true
          docker rm -f apq || true

  # The alpha path end to end: the api, scheduler and worker images
  # this commit builds, started as the compose `apps` profile a quickstart
  # user starts, driven only through the public HTTP API — create, events,
  # pending request, answer, follow-up, interrupt, pause, resume, terminate,
  # recovery, resume — plus the concurrency regressions, the pause coverage
  # branches, and a paused session whose workspace volume is deleted coming
  # back from its checkpoint, with and without a repository. A real Claude Code
  # runs in every worker; the compose fake Messages API answers it, so no
  # model account is involved. tests/e2e/run.sh does all of it and prints
  # the record the delivery plan asks for: command, tested SHA, image ids,
  # SDK and Claude Code versions, and the skip list.
  #
  # The runner's own daemon is used; the scheduler refuses one older than
  # Docker 28, and the record's first line shows which it got.
  # tests/e2e/compose.ci-mirror.yml points the stack's third-party images
  # and the Dockerfiles' base at the CI mirror.
  e2e:
    if: contains(fromJSON('["all","e2e"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    # Image builds take most of it; the scenario itself is a few minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
      - run: bun install --frozen-lockfile
      - name: Alpha path against the compose stack
        env:
          E2E_COMPOSE_OVERRIDE: tests/e2e/compose.ci-mirror.yml
          E2E_OUT: ${{ runner.temp }}/e2e
        run: tests/e2e/run.sh
      # run.sh removes the images it built; what compose pulled stays.
      - if: '!cancelled()'
        name: Nothing pulled from Docker Hub
        run: .github/scripts/assert-no-docker-hub-images.sh docker
      # Compose, worker and suite logs: the worker containers are gone by
      # now, so this is the only copy of what they printed.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-record
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
          retention-days: 14

  # docs/quickstart.md and docs/api-guide.md run as written on this fresh clone
  # every `bash` block, in order, on the default project and ports —
  # the terminal record a new user would get, printed block by block. A page
  # edit that breaks a command fails here instead of in someone's terminal.
  # COMPOSE_FILE adds the mirror overlay `e2e` uses under the
  # page's own `docker compose` commands, so the page needs no CI-only line.
  quickstart:
    if: contains(fromJSON('["all","quickstart"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: docs/quickstart.md
        env:
          COMPOSE_FILE: compose.yaml:tests/e2e/compose.ci-mirror.yml
          QUICKSTART_OUT: ${{ runner.temp }}/quickstart
        run: tests/e2e/quickstart.sh
      - name: docs/api-guide.md
        env:
          COMPOSE_FILE: compose.yaml:tests/e2e/compose.ci-mirror.yml
          QUICKSTART_OUT: ${{ runner.temp }}/api-guide
        run: tests/e2e/quickstart.sh docs/api-guide.md
      - if: '!cancelled()'
        name: Nothing pulled from Docker Hub
        run: .github/scripts/assert-no-docker-hub-images.sh docker
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quickstart-record
          path: |
            ${{ runner.temp }}/quickstart
            ${{ runner.temp }}/api-guide
          if-no-files-found: ignore
          retention-days: 14

  # The Helm chart (deploy/helm/agent-platform) with the CI digests and with
  # the AWS example: helm lint, the render check (hardening, probes,
  # resources, digests, RBAC, NetworkPolicy, and the renders it must refuse)
  # and kubeconform against the Kubernetes and CRD schemas. Both tools are
  # release binaries checked against their published sha256.
  helm-chart:
    if: contains(fromJSON('["all","helm-chart"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HELM_VERSION: v4.3.0
      HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      # The schemas, by commit: kubeconform's default and the CRD catalog
      # (ExternalSecret) both follow a branch otherwise.
      K8S_SCHEMAS: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/817113f21a2643311cbc3e992bb44ffe1c416c54/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json
      CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/63669a570e231d4f1f8396d229a1de512bcf0a34/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
      - name: helm and kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz -C bin --strip-components=1 linux-amd64/helm
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz -C bin kubeconform
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: helm lint
        run: |
          helm lint --strict deploy/helm/agent-platform -f deploy/helm/ci-digests.yaml
          helm lint --strict deploy/helm/agent-platform -f deploy/helm/ci-digests.yaml \
            -f deploy/helm/agent-platform/values-aws.example.yaml
      - name: Render check
        run: bun deploy/helm/render-check.ts
      - name: kubeconform
        run: |
          set -o pipefail
          for values in deploy/helm/ci-digests.yaml deploy/helm/agent-platform/values-aws.example.yaml; do
            echo "== $values"
            helm template ap deploy/helm/agent-platform -f deploy/helm/ci-digests.yaml -f "$values" \
              | kubeconform -strict -summary -kubernetes-version 1.33.0 \
                  -schema-location "$K8S_SCHEMAS" -schema-location "$CRD_SCHEMAS"
          done

  # The chart on a kind cluster, as deploy/kind/smoke.sh runs it locally: the
  # install answers /readyz and /docs, a fake-model session runs a turn in a
  # worker Pod the scheduler launched, terminate reclaims the Pod and its
  # PVC, a Pod with the worker labels reaches the egress proxy and nothing
  # else (kindnet enforces NetworkPolicy), and the KubernetesBackend suites
  # run against the cluster. Every image comes from the CI mirror: the node,
  # the registry and the stand-ins by their digests, the app builds' base and
  # frontend as build args.
  k8s-smoke:
    if: contains(fromJSON('["all","k8s-smoke"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HELM_VERSION: v4.3.0
      HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      KUBECTL_VERSION: v1.37.0
      KUBECTL_SHA256: 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
      - run: bun install --frozen-lockfile
      - name: kind, kubectl and helm
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo bin/kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  bin/kind" | sha256sum -c -
          curl -fsSLo bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  bin/kubectl" | sha256sum -c -
          chmod +x bin/kind bin/kubectl
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz -C bin --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: deploy/kind/smoke.sh
        env:
          CLUSTER_NAME: k8s-smoke
          STATE_DIR: ${{ runner.temp }}/kind
          KIND_NODE_IMAGE: ghcr.io/jeongjaesoon/agent-platform-ci/kind-node@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          REGISTRY_IMAGE: ghcr.io/jeongjaesoon/agent-platform-ci/registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          BUN_IMAGE: ghcr.io/jeongjaesoon/agent-platform-ci/bun@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
          BUILDKIT_SYNTAX: ghcr.io/jeongjaesoon/agent-platform-ci/dockerfile@sha256:a57df69d0ea827fb7266491f2813635de6f17269be881f696fbfdf2d83dda33e
          PROBE_IMAGE: ghcr.io/jeongjaesoon/agent-platform-ci/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          K8S_BACKEND_TEST_IMAGE: ghcr.io/jeongjaesoon/agent-platform-ci/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        # The stand-ins come from the same mirror as the bun base.
        run: KIND_IMAGE_MIRROR="${BUN_IMAGE%/*}" deploy/kind/smoke.sh
      - if: '!cancelled()'
        name: Nothing pulled from Docker Hub
        run: .github/scripts/assert-no-docker-hub-images.sh docker

  # The Agent SDK and LiteLLM compatibility harness, with its own lockfile.
  # Its failures have never been a product regression, so it reports without
  # blocking the run; see docs/contributing/ci.md.
  #
  # Deliberately NOT a required status check, for three reasons
  #   1. It does not run on pull_request, so a required `agent-sdk-compat` context would
  #      leave every PR waiting for a status that never arrives.
  # 2. Running it on every PR commit would bring back the cost
  #      removed: this is the most expensive job (python, uv,
  #      litellm[proxy], real CLI runs), right after a month's minutes ran out.
  #   3. It already runs on every main push, so a regression is caught within
  #      one commit of merging; gating PRs adds nothing. The gap that remained
  #      was nobody noticing, which the issue step at the end closes.
  agent-sdk-compat:
    needs: check
    # The job writes issues; nothing else in this workflow may.
    permissions:
      contents: read
      issues: write
    # Because a harness failure never blocks anything, running it on every PR
    # commit buys no signal the main-push run does not already give. It stays on
    # main pushes and on demand (`-f only=agent-sdk-compat`), which is also how
    # a PR that actually touches scripts/agent-sdk-compat/ gets its answer.
    if: >-
      !cancelled() && needs.check.result != 'failure'
      && github.event_name != 'pull_request'
      && contains(fromJSON('["all","agent-sdk-compat"]'), github.event.inputs.only || 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bun-setup
        with:
          cache-scope: agent-sdk-compat
          save-cache: "true"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      # The harness imports packages/testkit by relative path, so it needs the
      # root workspace installed as well as its own lockfile.
      - run: bun install --frozen-lockfile
      - run: bun install --cwd scripts/agent-sdk-compat --frozen-lockfile
      - run: uv tool install 'litellm[proxy]==1.100.1'
      - run: bun run --cwd scripts/agent-sdk-compat probe:version
      # No retry wrapper. This job is `continue-on-error`, so a failure never
      # blocks a merge and a retry buys no safety — it only squares the odds of
      # a flake being seen at all, which is how cause stayed hidden
      # for 233 runs. Let a failure show on its first occurrence.
      - id: harness
        name: agent-sdk-compat check
        run: bun run --cwd scripts/agent-sdk-compat check
      # continue-on-error leaves the run green, so whoever reads only the run
      # conclusion never learns the harness broke. State the outcome on the
      # summary page on every run that was not cancelled.
      - if: '!cancelled()'
        name: Report harness outcome
        env:
          HARNESS: ${{ steps.harness.outcome }}
        run: |
          {
            echo "### agent-sdk-compat (non-blocking)"
            echo
            echo "| suite | outcome |"
            echo "| --- | --- |"
            echo "| scripts/agent-sdk-compat | ${HARNESS} |"
            echo
            echo "This job never fails the run. A \`failure\` above still needs a look."
          } >>"$GITHUB_STEP_SUMMARY"
      # The summary table is only seen by whoever opens the run. A failure
      # also lands in an issue, one per open signal: repeats append to it.
      # `steps.*.outcome` rather than the run conclusion, which
      # continue-on-error keeps green; `!= 'success'` rather than
      # `== 'failure'` so a suite that never ran because setup broke counts
      # too. Not gated on `push` or on main: the job already never runs on
      # pull_request, a manual run is a person asking, and the body names the
      # ref. Gating on main would also leave the step untestable from a branch.
      # A job timeout or cancellation (no step runs) and a failure of the
      # issue call itself stay hidden here; main-push-run.yml reads the job's
      # conclusion afterwards and reports a failed run no issue names yet.
      - if: >-
          !cancelled()
          && steps.harness.outcome != 'success'
        name: Open or update the agent-sdk-compat failure issue
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          HARNESS: ${{ steps.harness.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "<!-- ci-agent-sdk-compat-failure -->"
            echo "\`agent-sdk-compat\` failed on \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA}\` (${GITHUB_EVENT_NAME}, [run ${GITHUB_RUN_ID}](${RUN_URL}))."
            echo
            echo "| suite | outcome |"
            echo "| --- | --- |"
            echo "| scripts/agent-sdk-compat | ${HARNESS} |"
            echo
            echo "The run itself is green (\`continue-on-error\`). Close this issue once the failure is understood; the next failure reopens a new one."
          } >body.md
          .github/scripts/upsert-ci-issue.sh ci-agent-sdk-compat-failure \
            "CI: agent-sdk-compat failed (non-blocking job)" body.md
