name: CI image mirror

# Copies every third-party image CI pulls — service containers, the images
# the Docker suites start, the dind daemon of `workspace-quota` — from Docker
# Hub to ghcr.io/<owner>/agent-platform-ci/<name>, byte for byte: the copy
# keeps the upstream digest, so ci.yml pins the very digest Docker Hub
# publishes and the daemon verifies it on every pull (94S-308). Docker Hub is
# then out of the CI path: its anonymous rate limit had already failed
# integration runs with `toomanyrequests`.
#
# The list below is the only record of what is mirrored.
# tests/ci-images.test.ts fails when ci.yml pulls an image that is not on it,
# by another digest, or from anywhere but the mirror; each Docker job of
# ci.yml also fails when its daemon ends up holding any other image. README
# § CI has the procedure for adding or bumping an image.
#
# Runs from main only, as images.yml publishes only from a tag: the token
# can write every package this repository can, the release images included,
# and code a pull request proposes must not hold that before review. So no
# pull_request trigger, and a dispatch from another ref skips the job. A new
# digest lands on main first; ci.yml moves to it in a later pull request.
on:
  push:
    branches: [main]
    paths: [.github/workflows/ci-image-mirror.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-image-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: mirror (${{ matrix.name }}:${{ matrix.tag }})
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The tag is for the reader and the mirror's tag list; the digest is
        # what is copied and what ci.yml pins. Every platform of the index is
        # copied, attestations included: dropping any would change the digest.
        # While a bump is under way one name may carry two entries, the old
        # digest and the new; the tag follows whichever copied last.
        include:
          - name: postgres
            source: docker.io/library/postgres
            tag: "16"
            digest: sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
          - name: localstack
            source: docker.io/localstack/localstack
            tag: "3"
            digest: sha256:b279c01f4cfb8f985a482e4014cabc1e2697b9d7a6c8c8db2e40f4d9f93687c7
          # Also the workspace-migration helper (DEFAULT_MIGRATION_HELPER_IMAGE).
          - name: busybox
            source: docker.io/library/busybox
            tag: "1.36"
            digest: sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          # The app Dockerfiles' base; the egress suite runs the proxy on it.
          - name: bun
            source: docker.io/oven/bun
            tag: "1.3.10"
            digest: sha256:b86c67b531d87b4db11470d9b2bd0c519b1976eee6fcd71634e73abfa6230d2e
          - name: curl
            source: docker.io/curlimages/curl
            tag: "8.11.1"
            digest: sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
          - name: docker
            source: docker.io/library/docker
            tag: "28-dind"
            digest: sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac
    steps:
      - name: Copy by digest
        env:
          NAME: ${{ matrix.name }}
          SOURCE: ${{ matrix.source }}
          TAG: ${{ matrix.tag }}
          DIGEST: ${{ matrix.digest }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # ghcr rejects upper-case repository paths.
          target="ghcr.io/${OWNER,,}/agent-platform-ci/${NAME}"
          echo "$GH_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # --preserve-digests fails the copy rather than re-encode anything.
          skopeo copy --all --preserve-digests --retry-times 3 \
            "docker://${SOURCE}@${DIGEST}" "docker://${target}:${TAG}"
          got="sha256:$(skopeo inspect --raw "docker://${target}@${DIGEST}" | sha256sum | cut -d' ' -f1)"
          [ "$got" = "$DIGEST" ] || { echo "::error::${target} serves ${got}, not ${DIGEST}"; exit 1; }
          # Every consumer pulls anonymously: the service containers, and the
          # suites through the Engine API, which sends no credentials.
          skopeo logout ghcr.io
          skopeo inspect --raw "docker://${target}@${DIGEST}" >/dev/null || {
            echo "::error::${target} is not public; set the package's visibility to public (README § CI)"
            exit 1
          }
          echo "${target}@${DIGEST}" >>"$GITHUB_STEP_SUMMARY"
