name: Bun setup
description: Pin the Bun version and restore the matching ~/.bun/install/cache.

inputs:
  cache-scope:
    description: >-
      Which set of lockfiles this job installs. `root` covers bun.lock alone;
      `spikes` covers bun.lock plus every spikes/*/bun.lock. The scope picks the
      cache key, so a key never promises more than its writer installed.
    default: root
  save-cache:
    description: >-
      One job per scope writes its cache; the rest restore it, so that parallel
      jobs never race on the same key.
    default: "false"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.14

    - id: key
      shell: bash
      # The Bun version and the runner architecture belong in the key: the cache
      # holds resolved, platform-specific packages.
      env:
        ROOT_KEY: bun-root-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock') }}
        SCOPE: ${{ inputs.cache-scope }}
        SPIKES_KEY: bun-spikes-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock', 'spikes/*/bun.lock') }}
      run: |
        if [ "$SCOPE" = spikes ]; then
          echo "cache=$SPIKES_KEY" >>"$GITHUB_OUTPUT"
          echo "restore=bun-spikes-${{ runner.os }}-${{ runner.arch }}-1.3.14-" >>"$GITHUB_OUTPUT"
        else
          echo "cache=$ROOT_KEY" >>"$GITHUB_OUTPUT"
          echo "restore=bun-root-${{ runner.os }}-${{ runner.arch }}-1.3.14-" >>"$GITHUB_OUTPUT"
        fi

    - if: inputs.save-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.key.outputs.cache }}
        restore-keys: ${{ steps.key.outputs.restore }}

    - if: inputs.save-cache != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.key.outputs.cache }}
        restore-keys: ${{ steps.key.outputs.restore }}
