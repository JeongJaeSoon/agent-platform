name: Bun setup
description: Pin the Bun version and restore the shared ~/.bun/install/cache.

inputs:
  save-cache:
    description: >-
      Exactly one job per run writes the cache; the others restore it, so that
      three parallel jobs never race on the same key.
    default: "false"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.10

    - id: key
      shell: bash
      # Spike lockfiles are part of the key: the spikes job installs them into
      # the same cache directory as the root workspace.
      run: |
        echo "cache=bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'spikes/*/bun.lock') }}" >> "$GITHUB_OUTPUT"

    - if: inputs.save-cache == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.key.outputs.cache }}
        restore-keys: bun-${{ runner.os }}-

    - if: inputs.save-cache != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.key.outputs.cache }}
        restore-keys: bun-${{ runner.os }}-
