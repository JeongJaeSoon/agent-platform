<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Platform 문서</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #5c5c5c;
        --border: #d4d4d4;
        --link: #0b57d0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141414;
          --fg: #ededed;
          --muted: #a3a3a3;
          --border: #3a3a3a;
          --link: #8ab4f8;
        }
      }
      body {
        margin: 0;
        padding: 48px 16px;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.75rem;
        margin: 0 0 32px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li + li {
        margin-top: 16px;
      }
      a {
        display: block;
        padding: 16px 20px;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--link);
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      a:focus-visible {
        outline: 2px solid var(--link);
        outline-offset: 2px;
      }
      a span {
        display: block;
        color: var(--muted);
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Agent Platform 문서</h1>
      <ul>
        <li>
          <a href="./api/">
            API 참조
            <span>/v1 HTTP API의 OpenAPI 문서</span>
          </a>
        </li>
        <li>
          <a href="./storybook/">
            Storybook
            <span>웹 콘솔 UI 컴포넌트와 화면 상태</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
