# Overlay for `tests/e2e/run.sh --real-model` (94S-373), after
# tests/e2e/compose.yml. Paths are relative to infra/, the project directory
# of the base file.
#
# Only the API gets the key, passed through by name from run.sh's
# environment so its value is in no file and no argument; the proxy puts it
# on each worker call (94S-252) and api.anthropic.com:443 is already the
# proxy's default EGRESS_CREDENTIAL_ALLOWLIST. The limits bound what one run can
# spend: the run makes one session, and the worker hands the session's
# remaining budget to the SDK as maxBudgetUsd (94S-279).
x-real-model-limits: &real-model-limits
  SESSION_COST_LIMIT_USD: "1"
  MAX_TURN_SECONDS: "600"

services:
  api:
    environment:
      ANTHROPIC_API_KEY:
      <<: *real-model-limits
    volumes: !override
      - ../tests/e2e/real-model:/app/config:ro
  scheduler:
    environment:
      <<: *real-model-limits
