# Layered on docker-compose.yml by scripts/restore.sh only:
#
#   docker compose -p <new-project> -f infra/docker-compose.yml \
#     -f infra/docker-compose.restore.yml up -d postgres localstack gitea
#
# A restore is a second installation on the same daemon, so everything the
# base file fixes per host has to move: published ports are re-bound from
# RESTORE_* variables (loopback only) and Gitea's external address follows
# them. Worker networks need no counterpart: the scheduler names each one
# after its installation and execution. The restore starts no egress proxy,
# so its label cannot collide with the live installation's. `!override`
# replaces the base list instead of merging into it. Compose v2.24.6+: older
# releases refuse an overlay on services docker-compose.yml includes.
#
# The postgres init mounts are dropped too. The base file applies the legacy
# M0 SQL on first start, which would leave tables the restored dump then
# tries to create; a dump goes into an empty database, and the dump itself
# carries the drizzle journal that says which migrations it already has.
services:
  postgres:
    ports: !override
      - "127.0.0.1:${RESTORE_POSTGRES_PORT:?}:5432"
    volumes: !override
      - postgres-data:/var/lib/postgresql/data

  localstack:
    ports: !override
      - "127.0.0.1:${RESTORE_LOCALSTACK_PORT:?}:4566"

  # The restored app.ini is the backup's, secrets and all, so its [server]
  # section still names the source's address. The image's entrypoint runs
  # environment-to-ini on every start, which rewrites just these keys and
  # leaves the rest of the file alone; HTTP_PORT and SSH_LISTEN_PORT are the
  # container-side ports and stay as they are.
  gitea:
    ports: !override
      - "127.0.0.1:${RESTORE_GITEA_HTTP_PORT:?}:3000"
      - "127.0.0.1:${RESTORE_GITEA_SSH_PORT:?}:22"
    environment:
      GITEA__server__ROOT_URL: http://127.0.0.1:${RESTORE_GITEA_HTTP_PORT:?}/
      GITEA__server__DOMAIN: 127.0.0.1
      GITEA__server__SSH_DOMAIN: 127.0.0.1
      GITEA__server__SSH_PORT: ${RESTORE_GITEA_SSH_PORT:?}
