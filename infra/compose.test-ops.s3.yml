# The test-ops object store on AWS S3 itself (TEST_OPS_OBJECT_STORE=s3),
# merged after compose.test-ops.yml: no endpoint, the IAM key on the API
# alone. Like that layer it only requires values.
services:
  api:
    environment:
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET must name the installation's bucket}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID must be the API's S3 key}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY must be the API's S3 key}
  scheduler:
    environment:
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET must name the installation's bucket}
