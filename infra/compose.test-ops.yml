# The test-ops layer over compose.core.yml, merged after it and
# before the object store's layer:
#
#   docker compose -f infra/compose.core.yml -f infra/compose.test-ops.yml \
#     -f infra/compose.test-ops.<localstack|s3>.yml ...
#
# scripts/test-ops.sh is how it runs (docs/operator/test-ops.md): the release manifest
# names the three app images by digest, and the installation's env file,
# outside the checkout, every other value below. The layer runs no local
# dependency, builds nothing, and only requires values — it sets none — so
# a forgotten one stops compose instead of falling back to a core default
# meant for the local stack. The provider key goes to the API alone.
# tests/images.test.ts renders this and keeps the security settings out of it.

# Where scripts/test-ops.sh checks the API. The script never reads the env
# file, so the value reaches it through the render; no service receives it.
x-test-ops-api-url: ${TEST_OPS_API_URL:-http://127.0.0.1:${TEST_OPS_API_PORT:-3000}}

services:
  # A host restart brings back only what has a restart policy. The core layer
  # gives it to the services that keep no state; postgres and the API get it
  # here so that a reboot does not leave the installation half up. A stopped
  # stack stays down: compose down removes the containers, and
  # unless-stopped never restarts one the operator stopped.
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for test-ops}
  migrate:
    image: ${API_IMAGE:?API_IMAGE must name the released control-host image}
    environment:
      SETTINGS_DOCUMENT: /settings/installation.json
    volumes:
      - ${PLATFORM_SETTINGS_DOCUMENT:?PLATFORM_SETTINGS_DOCUMENT must name the settings document}:/settings/installation.json:ro
  api:
    restart: unless-stopped
    image: ${API_IMAGE:?API_IMAGE must name the released control-host image}
    environment:
      EGRESS_AUTHORIZER_TOKEN: ${EGRESS_AUTHORIZER_TOKEN:?EGRESS_AUTHORIZER_TOKEN must be set for test-ops}
      # Optional. The model key is normally entered on the console's model
      # connections screen and sealed in the database. Set it only for a
      # connection that names it with `value_env: ANTHROPIC_API_KEY`; unset,
      # that connection stays out of the catalog and a session on its profile
      # is refused with the screen path.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PLATFORM_SECRET_KEY: ${PLATFORM_SECRET_KEY:?PLATFORM_SECRET_KEY must be set for test-ops}
  scheduler:
    image: ${API_IMAGE:?API_IMAGE must name the released control-host image}
    environment:
      WORKER_IMAGE: ${WORKER_IMAGE:?WORKER_IMAGE must name the released worker image}
      # How this installation's workers and proxy are told apart from any
      # other on the daemon; the core's `local` belongs to the local stack.
      EXECUTION_INSTALLATION_ID: ${EXECUTION_INSTALLATION_ID:?EXECUTION_INSTALLATION_ID must name this installation}
      EXECUTION_WORKSPACE_QUOTA: ${EXECUTION_WORKSPACE_QUOTA:?EXECUTION_WORKSPACE_QUOTA must be set (on, with xfs prjquota)}
  reconciler:
    image: ${API_IMAGE:?API_IMAGE must name the released control-host image}
  maintenance:
    image: ${API_IMAGE:?API_IMAGE must name the released control-host image}
  slack:
    image: ${API_IMAGE:?API_IMAGE must name the released control-host image}
    environment:
      PLATFORM_SECRET_KEY: ${PLATFORM_SECRET_KEY:?PLATFORM_SECRET_KEY must be set for test-ops}
  egress-proxy:
    image: ${EGRESS_PROXY_IMAGE:?EGRESS_PROXY_IMAGE must name the released egress-proxy image}
    environment:
      EGRESS_AUTHORIZER_TOKEN: ${EGRESS_AUTHORIZER_TOKEN:?EGRESS_AUTHORIZER_TOKEN must be set for test-ops}
      # The core default names the local stack's upstreams. Here: the
      # provider and, on s3, the bucket's S3 host. LocalStack's layer requires
      # the private list.
      EGRESS_CREDENTIAL_ALLOWLIST: ${EGRESS_CREDENTIAL_ALLOWLIST:?EGRESS_CREDENTIAL_ALLOWLIST must name the provider (and the bucket's S3 host on s3)}
  worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE must name the released worker image}
