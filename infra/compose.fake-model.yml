# The fake-model overlay: the local stack without an Anthropic account, for
# `scripts/local.sh up --fake-model` over compose.yaml and the free runs
# over infra/docker-compose.yml (tests/e2e/run.sh, quickstart, restore,
# gate and soak). It names no path, so it merges the same under either
# project directory.
#
# It turns on compose.local.yml's fake-messages and points the API at
# config/fake-model, whose profile calls it with a placeholder key from the
# local Secrets Manager. Sessions follow the GATE-SPEC script in each prompt
# (docs/quickstart.md § 스크립트된 프롬프트).
services:
  fake-messages:
    profiles: !reset []
  api:
    environment:
      PLATFORM_CONFIG_DIR: /app/config/fake-model
    depends_on:
      fake-messages:
        condition: service_healthy
