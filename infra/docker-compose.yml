name: agent-platform

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sessions}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../packages/db/migrations/0000_gifted_morg.sql:/docker-entrypoint-initdb.d/0000_m0.sql:ro
      - ../packages/db/migrations/0001_giant_sphinx.sql:/docker-entrypoint-initdb.d/0001_m0.sql:ro
      - ../packages/db/migrations/0002_thin_victor_mancha.sql:/docker-entrypoint-initdb.d/0002_m0.sql:ro
      - ../packages/db/migrations/0003_lethal_blue_blade.sql:/docker-entrypoint-initdb.d/0003_m0.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  migrate:
    image: oven/bun:1.3.10
    working_dir: /app
    command: ["bun", "run", "--cwd", "packages/db", "db:migrate"]
    environment:
      # A DATABASE_URL in the shell (or passed with --env-file) wins; the
      # default is the compose postgres. An `environment` entry beats
      # env_file, so a URL that only lives in the env file must come in
      # through interpolation.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev}@postgres:5432/${POSTGRES_DB:-sessions}}
    volumes:
      - ..:/app:ro
    depends_on:
      postgres:
        condition: service_healthy

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3,secretsmanager
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-northeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./localstack/init/10-create-resources.sh:/etc/localstack/init/ready.d/10-create-resources.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health >/dev/null && awslocal s3api head-bucket --bucket claude-sessions >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  gitea:
    image: gitea/gitea:1.22
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
    ports:
      - "3001:3000"
      - "2222:22"
    volumes:
      - gitea-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/v1/version >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # The only member of the worker network with a route off it. Workers are
  # handed it as HTTP_PROXY/HTTPS_PROXY; the two allowlists below are the
  # whole of what a worker can reach.
  egress-proxy:
    image: oven/bun:1.3.10
    command: ["bun", "run", "/app/src/main.ts"]
    environment:
      EGRESS_ALLOWLIST: ${EGRESS_ALLOWLIST:-api.anthropic.com:443}
      # api:3000 is the compose-run API (`apps` profile); host.docker.internal
      # stays for an API started on the host with `bun run --cwd apps/api start`.
      EGRESS_PRIVATE_ALLOWLIST: ${EGRESS_PRIVATE_ALLOWLIST:-api:3000,host.docker.internal:3000,gitea:3000}
      EGRESS_PROXY_PORT: "3128"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    extra_hosts:
      # The worker gateway runs on the host; only the proxy may reach it.
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - worker
    volumes:
      - ../apps/egress-proxy:/app:ro
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3128/healthz'); if (!r.ok) process.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # `apps` profile: the sessions API and the scheduler, built from
  # apps/*/Dockerfile. `docker compose --profile apps up -d --build`.
  # Every value below has a working default so the profile starts without a
  # ../.env; one is read when present and never written (README rule).
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: ${API_IMAGE:-agent-platform-api:dev}
    profiles: ["apps"]
    ports:
      - "3000:3000"
    env_file:
      - path: ../.env
        required: false
    environment:
      # A DATABASE_URL in the shell (or passed with --env-file) wins; the
      # default is the compose postgres. An `environment` entry beats
      # env_file, so a URL that only lives in the env file must come in
      # through interpolation.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev}@postgres:5432/${POSTGRES_DB:-sessions}}
      AUTH_MODE: ${AUTH_MODE:-none}
      HEARTBEAT_TTL_SEC: ${HEARTBEAT_TTL_SEC:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "3000"
      # SESSION_CATALOG_JSON is deliberately not defaulted: the API parses an
      # empty string as JSON and refuses to start. Put it in ../.env when
      # sessions should be creatable; unset, POST /v1/sessions answers 422.
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/readyz'); if (!r.ok) process.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      gitea:
        condition: service_healthy

  # Not a long-running service: workers are launched per session by the
  # scheduler through the Docker socket, which is why this one has no
  # depends_on and no network of its own. The entry exists so
  # `docker compose --profile worker build` produces the image WORKER_IMAGE
  # names, and `docker compose --profile worker run --rm worker claude
  # --version` inspects it. Its default command exits at once until 94S-122.
  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    image: ${WORKER_IMAGE:-agent-platform-worker:dev}
    profiles: ["worker"]
    network_mode: none
    read_only: true
    user: "1000:1000"
    tmpfs:
      - /tmp:uid=1000,gid=1000
      - /home/bun:uid=1000,gid=1000

  # Renamed from local-scaler when the app became apps/scheduler (94S-123).
  # apps/scheduler is one pass per process (cron/Job shape); the loop that
  # makes a locally accepted session actually grow a worker lives here, in
  # compose, so the app keeps its one-shot contract. The interval is also the
  # backoff after a failed pass (exit 1), and the restart policy covers the
  # loop shell itself dying.
  scheduler:
    build:
      context: ..
      dockerfile: apps/scheduler/Dockerfile
    image: ${SCHEDULER_IMAGE:-agent-platform-scheduler:dev}
    profiles: ["apps"]
    command:
      - sh
      - -c
      - |
        while :; do
          bun run apps/scheduler/src/main.ts || echo "scheduler pass failed (exit $$?)" >&2
          sleep "$${SCHEDULER_INTERVAL_SEC:-5}"
        done
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      # A DATABASE_URL in the shell (or passed with --env-file) wins; the
      # default is the compose postgres. An `environment` entry beats
      # env_file, so a URL that only lives in the env file must come in
      # through interpolation.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev}@postgres:5432/${POSTGRES_DB:-sessions}}
      DOCKER_HOST: unix:///var/run/docker.sock
      # Workers reach the API only through the proxy; `api` resolves on the
      # default network the proxy also sits on (EGRESS_PRIVATE_ALLOWLIST).
      WORKER_GATEWAY_URL: ${WORKER_GATEWAY_URL:-http://api:3000}
      WORKER_IMAGE: ${WORKER_IMAGE:-agent-platform-worker:dev}
      EXECUTION_INSTALLATION_ID: ${EXECUTION_INSTALLATION_ID:-local}
      EXECUTION_DOCKER_NETWORK: ${EXECUTION_DOCKER_NETWORK:-agent-platform-worker}
      EXECUTION_DOCKER_NETWORK_ALLOWLIST: ${EXECUTION_DOCKER_NETWORK_ALLOWLIST:-agent-platform-worker}
      EXECUTION_EGRESS_PROXY_URL: ${EXECUTION_EGRESS_PROXY_URL:-http://egress-proxy:3128}
      EXECUTION_SLOT_LIMIT: ${EXECUTION_SLOT_LIMIT:-10}
      SCHEDULER_INTERVAL_SEC: ${SCHEDULER_INTERVAL_SEC:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      egress-proxy:
        condition: service_healthy

networks:
  default:
  # Worker containers only ever join this one. `internal` is what makes the
  # egress policy enforceable: Docker installs no route off it, so the proxy
  # is the only way out and the scheduler refuses to launch if this flag is
  # ever lost (`verifyNetworkIsolation`).
  worker:
    # Daemon-global, so two installations on one daemon must not share it: a
    # worker on a shared network reaches the other installation's proxy and
    # its allowlist. Each installation overrides this to match its own
    # EXECUTION_DOCKER_NETWORK.
    name: ${EXECUTION_DOCKER_NETWORK:-agent-platform-worker}
    internal: true

volumes:
  postgres-data:
  localstack-data:
  gitea-data:
