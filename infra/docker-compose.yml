name: agent-platform

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sessions}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../packages/db/migrations/0000_gifted_morg.sql:/docker-entrypoint-initdb.d/0000_m0.sql:ro
      - ../packages/db/migrations/0001_giant_sphinx.sql:/docker-entrypoint-initdb.d/0001_m0.sql:ro
      - ../packages/db/migrations/0002_thin_victor_mancha.sql:/docker-entrypoint-initdb.d/0002_m0.sql:ro
      - ../packages/db/migrations/0003_lethal_blue_blade.sql:/docker-entrypoint-initdb.d/0003_m0.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  migrate:
    image: oven/bun:1.3.10
    working_dir: /app
    command: ["bun", "run", "--cwd", "packages/db", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev}@postgres:5432/${POSTGRES_DB:-sessions}
    volumes:
      - ..:/app:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Workers reach this through the egress proxy (EGRESS_PRIVATE_ALLOWLIST
  # below), so it runs S3 alone: every service on the allowlisted port is a
  # service a worker can call, and nothing here uses Secrets Manager.
  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-northeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./localstack/init/10-create-resources.sh:/etc/localstack/init/ready.d/10-create-resources.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health >/dev/null && awslocal s3api head-bucket --bucket claude-sessions >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  gitea:
    image: gitea/gitea:1.22
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
    ports:
      - "3001:3000"
      - "2222:22"
    volumes:
      - gitea-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/v1/version >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # The only member of the worker network with a route off it. Workers are
  # handed it as HTTP_PROXY/HTTPS_PROXY; the two allowlists below are the
  # whole of what a worker can reach.
  egress-proxy:
    image: oven/bun:1.3.10
    command: ["bun", "run", "/app/src/main.ts"]
    environment:
      EGRESS_ALLOWLIST: ${EGRESS_ALLOWLIST:-api.anthropic.com:443}
      EGRESS_PRIVATE_ALLOWLIST: ${EGRESS_PRIVATE_ALLOWLIST:-host.docker.internal:3000,gitea:3000,localstack:4566}
      EGRESS_PROXY_PORT: "3128"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    extra_hosts:
      # The worker gateway runs on the host; only the proxy may reach it.
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - worker
    volumes:
      - ../apps/egress-proxy:/app:ro
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3128/healthz'); if (!r.ok) process.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # The three app profiles below name image definitions the repository does
  # not have yet; they arrive with 94S-125. Until then only the default profile
  # (postgres, migrate, localstack, gitea, egress-proxy) starts.
  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    profiles: ["apps"]
    ports:
      - "3000:3000"
    env_file: ../.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      gitea:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    profiles: ["worker"]
    env_file: ../.env
    environment:
      POD_ID: ${POD_ID:-local-worker}
    mem_limit: ${WORKER_MEM_LIMIT:-2g}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      gitea:
        condition: service_healthy

  # Renamed from local-scaler when the app became apps/scheduler (94S-123).
  scheduler:
    build:
      context: ..
      dockerfile: Dockerfile.scheduler
    profiles: ["apps"]
    env_file: ../.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

networks:
  default:
  # Worker containers only ever join this one. `internal` is what makes the
  # egress policy enforceable: Docker installs no route off it, so the proxy
  # is the only way out and the scheduler refuses to launch if this flag is
  # ever lost (`verifyNetworkIsolation`).
  worker:
    # Daemon-global, so two installations on one daemon must not share it: a
    # worker on a shared network reaches the other installation's proxy and
    # its allowlist. Each installation overrides this to match its own
    # EXECUTION_DOCKER_NETWORK.
    name: ${EXECUTION_DOCKER_NETWORK:-agent-platform-worker}
    internal: true

volumes:
  postgres-data:
  localstack-data:
  gitea-data:
