name: agent-platform

# Installation limits (94S-131). The API and the scheduler both refuse to
# start without them, and read them with one parser, so both services take
# this one block. These are local defaults, not recommendations: size them
# per installation.
x-installation-limits: &installation-limits
  EXECUTION_SLOT_LIMIT: ${EXECUTION_SLOT_LIMIT:-10}
  QUEUED_INPUT_LIMIT_PER_SESSION: ${QUEUED_INPUT_LIMIT_PER_SESSION:-20}
  # Retained input messages across the installation; 1 GiB.
  STORAGE_LIMIT_BYTES: ${STORAGE_LIMIT_BYTES:-1073741824}
  MAX_TURN_SECONDS: ${MAX_TURN_SECONDS:-3600}
  SESSION_COST_LIMIT_USD: ${SESSION_COST_LIMIT_USD:-25}
  PROVIDER_MAX_RETRIES: ${PROVIDER_MAX_RETRIES:-2}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sessions}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../packages/db/migrations/0000_gifted_morg.sql:/docker-entrypoint-initdb.d/0000_m0.sql:ro
      - ../packages/db/migrations/0001_giant_sphinx.sql:/docker-entrypoint-initdb.d/0001_m0.sql:ro
      - ../packages/db/migrations/0002_thin_victor_mancha.sql:/docker-entrypoint-initdb.d/0002_m0.sql:ro
      - ../packages/db/migrations/0003_lethal_blue_blade.sql:/docker-entrypoint-initdb.d/0003_m0.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  migrate:
    image: oven/bun:1.3.10
    working_dir: /app
    command: ["bun", "run", "--cwd", "packages/db", "db:migrate"]
    environment:
      # Always the compose postgres, never an ambient DATABASE_URL: `up`
      # runs migrate, and a production DSN sitting in someone's shell or
      # env file must not get migrated by starting the local stack. An
      # external database is run against by the apps outside compose.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev}@postgres:5432/${POSTGRES_DB:-sessions}
    volumes:
      - ..:/app:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Workers reach this through the egress proxy (EGRESS_PRIVATE_ALLOWLIST
  # below), so it runs S3 alone: every service on the allowlisted port is a
  # service a worker can call, and nothing here uses Secrets Manager.
  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-northeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./localstack/init/10-create-resources.sh:/etc/localstack/init/ready.d/10-create-resources.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health >/dev/null && awslocal s3api get-object-lock-configuration --bucket claude-sessions >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # The API's Secrets Manager (94S-132), apart from `localstack` on purpose:
  # workers reach that one through the egress proxy, and nothing on the
  # allowlist may answer for the provider keys the catalog references. Only
  # the API talks to it (AWS_ENDPOINT_URL_SECRETS_MANAGER).
  secrets:
    image: localstack/localstack:3
    environment:
      SERVICES: secretsmanager
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-northeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    ports:
      # For an API started on the host (README); loopback only.
      - "127.0.0.1:4567:4566"
    volumes:
      - ./localstack/secrets-init/10-seed-secrets.sh:/etc/localstack/init/ready.d/10-seed-secrets.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal secretsmanager describe-secret --secret-id agent-platform/local/fake-messages >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # The Messages API the example profile (config/profiles.yaml) points at, so
  # the local stack runs sessions without an Anthropic account. Workers reach
  # it through the proxy (EGRESS_PRIVATE_ALLOWLIST).
  fake-messages:
    image: oven/bun:1.3.10
    command: ["bun", "run", "/app/packages/testkit/src/fake-messages-main.ts"]
    environment:
      FAKE_MESSAGES_PORT: "4010"
    volumes:
      - ..:/app:ro
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://127.0.0.1:4010/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  gitea:
    image: gitea/gitea:1.22
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
    ports:
      - "3001:3000"
      - "2222:22"
    volumes:
      - gitea-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/v1/version >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # The only route off every worker network. The scheduler gives each worker
  # an internal network of its own and attaches this container to it under
  # the name in EXECUTION_EGRESS_PROXY_URL (94S-216); workers are handed it as
  # HTTP_PROXY/HTTPS_PROXY, and the two allowlists below are the whole of
  # what a worker can reach. The label is how the scheduler finds it, so each
  # installation on a daemon labels its own proxy with its own id.
  egress-proxy:
    image: oven/bun:1.3.10
    command: ["bun", "run", "/app/src/main.ts"]
    environment:
      EGRESS_ALLOWLIST: ${EGRESS_ALLOWLIST:-api.anthropic.com:443}
      # api:3000 is the compose-run API (`apps` profile); host.docker.internal
      # stays for an API started on the host with `bun run --cwd apps/api start`.
      # localstack:4566 is the worker's object store (94S-244);
      # fake-messages:4010 is the example profile's Messages API (94S-132).
      # `secrets` is deliberately absent.
      EGRESS_PRIVATE_ALLOWLIST: ${EGRESS_PRIVATE_ALLOWLIST:-api:3000,host.docker.internal:3000,gitea:3000,localstack:4566,fake-messages:4010}
      EGRESS_PROXY_PORT: "3128"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    extra_hosts:
      # The worker gateway runs on the host; only the proxy may reach it.
      - "host.docker.internal:host-gateway"
    labels:
      agent-platform.egress-proxy: ${EXECUTION_INSTALLATION_ID:-local}
    volumes:
      - ../apps/egress-proxy:/app:ro
    # Also unhealthy when the mounted source no longer matches what the
    # process loaded: a checkout moved under a running proxy keeps serving the
    # old code (94S-319). `up -d --wait` then fails; recreate the service.
    healthcheck:
      test: ["CMD", "bun", "run", "/app/src/healthcheck.ts"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # `apps` profile: the sessions API and the scheduler, built from
  # apps/*/Dockerfile. `docker compose --profile apps up -d --build`.
  # Every value below has a working default so the profile starts without a
  # ../.env; one is read when present and never written (README rule).
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: ${API_IMAGE:-agent-platform-api:dev}
    profiles: ["apps"]
    # No `init: true`: the image's own ENTRYPOINT is tini (apps/api/Dockerfile),
    # so the git helpers the checkpoint verifier orphans are reaped wherever
    # the image runs, not only here.
    #
    # Memory budget, as an upper bound rather than a measurement. Up to 2
    # bundles are verified at once (DEFAULT_MAX_CONCURRENT_BUNDLE_VERIFICATIONS).
    # Each has git fetch and its index-pack alive together, each capped at
    # CHECKPOINT_GIT_MEMORY_MB of address space (fsck runs after them, not
    # beside), while the service holds the bundle about twice over
    # (2 x 128 MiB). So:
    #   2 x (2 x 1536 + 256) MiB = 6656 MiB for verification
    #   + 512 MiB for the API itself           = 7168 MiB
    # Measured far below it: two concurrent verifications of 94S-259's worst
    # honest bundle (480 MiB file, one edit) peaked at 3.5 GiB including page
    # cache, which the kernel reclaims before it OOM-kills anything. A crafted
    # delta can drive index-pack to the cap, so the bound, not the measurement,
    # sets the limit.
    # Change the two values together: raising the cap without the limit
    # hands the choice of what dies to the OOM killer (94S-259 saw it kill
    # index-pack under 1 GiB), and lowering the limit without the cap does
    # the same. A cap below 256 MiB is refused at startup.
    mem_limit: ${API_MEMORY_MB:-7168}m
    ports:
      # Loopback only; a local development listener has no business on
      # other hosts' interfaces even in api-key mode.
      - "127.0.0.1:3000:3000"
    env_file:
      - path: ../.env
        required: false
    environment:
      # Always the compose postgres, never an ambient DATABASE_URL: `up`
      # runs migrate, and a production DSN sitting in someone's shell or
      # env file must not get migrated by starting the local stack. An
      # external database is run against by the apps outside compose.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev}@postgres:5432/${POSTGRES_DB:-sessions}
      # api-key, not none: workers reach this listener through the proxy
      # (api:3000 in EGRESS_PRIVATE_ALLOWLIST) and in `none` mode /v1 takes
      # any X-Owner-Id as the caller's identity, so a compromised worker could
      # act as any owner. Issue a key with
      # `docker compose exec api bun run apps/api/src/keys.ts create <owner>
      # --scopes sessions:read,sessions:write`.
      # /internal routes carry their own worker authentication either way.
      AUTH_MODE: ${AUTH_MODE:-api-key}
      <<: *installation-limits
      # Read by the API alone: every lease it grants carries its deadline
      # into the database, and the reconciler refuses to start with its own.
      HEARTBEAT_TTL_SEC: ${HEARTBEAT_TTL_SEC:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "3000"
      # The operator catalog (94S-132): config/ mounted below. The image
      # carries none, so an API without a mounted catalog does not start.
      PLATFORM_CONFIG_DIR: /app/config
      AWS_ENDPOINT_URL_SECRETS_MANAGER: ${AWS_ENDPOINT_URL_SECRETS_MANAGER:-http://secrets:4566}
      # Checkpoint object store (94S-201): the same LocalStack bucket the
      # scheduler hands each worker. The API reads manifests, transcripts
      # and workspace bundles back from it to verify a checkpoint before the
      # session pointer advances; without these the API refuses to start
      # (CHECKPOINT_OBJECT_STORE=disabled is the explicit opt-out).
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}
      AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      S3_BUCKET: ${S3_BUCKET:-claude-sessions}
      # Pin every checkpoint object by version and hold what a checkpoint
      # commits (94S-229); the bucket above is created with Object Lock.
      # "unversioned" reads by key only — for a bucket without versioning. A
      # restored bucket needs no such thing: restore re-pins (94S-282).
      CHECKPOINT_OBJECT_PROTECTION: ${CHECKPOINT_OBJECT_PROTECTION:-locked}
      # Sized with mem_limit above.
      CHECKPOINT_GIT_MEMORY_MB: ${CHECKPOINT_GIT_MEMORY_MB:-1536}
    volumes:
      - ../config:/app/config:ro
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/readyz'); if (!r.ok) process.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      secrets:
        condition: service_healthy
      fake-messages:
        condition: service_healthy
      gitea:
        condition: service_healthy

  # Not a long-running service: workers are launched per session by the
  # scheduler through the Docker socket, which is why this one has no
  # depends_on and no network of its own. The entry exists so
  # `docker compose --profile worker build` produces the image WORKER_IMAGE
  # names, and `docker compose --profile worker run --rm worker claude
  # --version` inspects it. Its default command exits at once until 94S-122.
  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    image: ${WORKER_IMAGE:-agent-platform-worker:dev}
    profiles: ["worker"]
    network_mode: none
    read_only: true
    user: "1000:1000"
    tmpfs:
      - /tmp:uid=1000,gid=1000
      - /home/bun:uid=1000,gid=1000

  # Renamed from local-scaler when the app became apps/scheduler (94S-123).
  # apps/scheduler is one pass per process (cron/Job shape); the loop that
  # makes a locally accepted session actually grow a worker lives here, in
  # compose, so the app keeps its one-shot contract. The app's non-zero exit
  # is kept observable two ways: the loop gives up after
  # SCHEDULER_MAX_CONSECUTIVE_FAILURES failed passes so the restart policy
  # engages and `compose ps` shows it restarting, and the healthcheck goes
  # unhealthy when no pass has succeeded for SCHEDULER_HEALTH_STALE_SEC. A
  # frozen database ends a pass on its own: JOB_POOL_TIMEOUTS
  # (packages/db/src/pool.ts) bound the failing statement to connect 5s +
  # read 20s and the pass-lock unlock to another 20s, and every store call
  # after a lost connection fails at once, so the pass exits 1 about 45s in
  # (94S-255). SCHEDULER_PASS_TIMEOUT_SEC stays above that budget as the
  # watchdog for anything else that hangs — Docker calls have no such
  # bound — and a killed pass counts as a failure too, since Docker never
  # restarts a container for being unhealthy.
  scheduler:
    build:
      context: ..
      dockerfile: apps/scheduler/Dockerfile
    image: ${SCHEDULER_IMAGE:-agent-platform-scheduler:dev}
    profiles: ["apps"]
    command:
      - sh
      - -c
      - |
        fails=0
        while :; do
          if timeout -k 10 "$${SCHEDULER_PASS_TIMEOUT_SEC:-120}" bun run apps/scheduler/src/main.ts; then
            fails=0
            touch /tmp/scheduler-last-ok
          else
            fails=$$((fails + 1))
            echo "scheduler pass failed ($$fails consecutive)" >&2
            if [ "$$fails" -ge "$${SCHEDULER_MAX_CONSECUTIVE_FAILURES:-3}" ]; then
              echo "giving up after $$fails failed passes" >&2
              exit 1
            fi
          fi
          sleep "$${SCHEDULER_INTERVAL_SEC:-5}"
        done
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/scheduler-last-ok -newermt \"$${SCHEDULER_HEALTH_STALE_SEC:-60} seconds ago\" | grep -q ."]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    env_file:
      - path: ../.env
        required: false
    environment:
      # Always the compose postgres, never an ambient DATABASE_URL: `up`
      # runs migrate, and a production DSN sitting in someone's shell or
      # env file must not get migrated by starting the local stack. An
      # external database is run against by the apps outside compose.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev}@postgres:5432/${POSTGRES_DB:-sessions}
      DOCKER_HOST: unix:///var/run/docker.sock
      # Workers reach the API only through the proxy; `api` resolves on the
      # default network the proxy also sits on (EGRESS_PRIVATE_ALLOWLIST).
      WORKER_GATEWAY_URL: ${WORKER_GATEWAY_URL:-http://api:3000}
      WORKER_IMAGE: ${WORKER_IMAGE:-agent-platform-worker:dev}
      EXECUTION_INSTALLATION_ID: ${EXECUTION_INSTALLATION_ID:-local}
      EXECUTION_EGRESS_PROXY_URL: ${EXECUTION_EGRESS_PROXY_URL:-http://egress-proxy:3128}
      <<: *installation-limits
      # Docker Desktop cannot carry a project quota, so the local stack opts out
      # (94S-215); a daemon on xfs+prjquota should set it back to `on`.
      EXECUTION_WORKSPACE_QUOTA: ${EXECUTION_WORKSPACE_QUOTA:-off}
      EXECUTION_WORKSPACE_QUOTA_MB: ${EXECUTION_WORKSPACE_QUOTA_MB:-4096}
      EXECUTION_WORKSPACE_GC_MIN_AGE_SEC: ${EXECUTION_WORKSPACE_GC_MIN_AGE_SEC:-3600}
      EXECUTION_WORKSPACE_STOPPED_TTL_SEC: ${EXECUTION_WORKSPACE_STOPPED_TTL_SEC:-86400}
      WORKER_CPUS: ${WORKER_CPUS:-1}
      WORKER_MEMORY_MB: ${WORKER_MEMORY_MB:-2048}
      # Object store the scheduler hands each worker (94S-244): the compose
      # LocalStack, same values the localstack service is started with.
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}
      AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      S3_BUCKET: ${S3_BUCKET:-claude-sessions}
      SCHEDULER_INTERVAL_SEC: ${SCHEDULER_INTERVAL_SEC:-5}
      SCHEDULER_MAX_CONSECUTIVE_FAILURES: ${SCHEDULER_MAX_CONSECUTIVE_FAILURES:-3}
      SCHEDULER_HEALTH_STALE_SEC: ${SCHEDULER_HEALTH_STALE_SEC:-60}
      SCHEDULER_PASS_TIMEOUT_SEC: ${SCHEDULER_PASS_TIMEOUT_SEC:-120}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      egress-proxy:
        condition: service_healthy
      localstack:
        condition: service_healthy

networks:
  # Worker networks are not declared here: the scheduler creates one per
  # worker (internal, IPv6 off) and removes it with the worker.
  default:

volumes:
  postgres-data:
  localstack-data:
  gitea-data:
