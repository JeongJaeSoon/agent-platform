# Opt-in overlay with infra/compose.fake-model.yml, for `scripts/local.sh up
# --fake-model` with this file in COMPOSE_FILE: migrate imports
# fake-model-unattended.json, which adds a `bypassPermissions` ceiling, and
# the installation allows it. Without it PLATFORM_ALLOW_UNATTENDED_PERMISSIONS
# stays false and such a ceiling runs nothing (docs/operator/api-server.md,
# 자율 모드). `auto` needs neither: the plain fake-model settings carry
# claude-coding-auto.
#
# The document is mounted where the fake-model overlay points
# SETTINGS_DOCUMENT, since local.sh puts that overlay after COMPOSE_FILE and
# it would win a value set here. The path is from the repository root,
# compose.yaml's directory.
services:
  migrate:
    volumes:
      - ./tests/fixtures/settings/fake-model-unattended.json:/settings/fake-model.json:ro
  api:
    environment:
      PLATFORM_ALLOW_UNATTENDED_PERMISSIONS: "true"
  slack:
    environment:
      PLATFORM_ALLOW_UNATTENDED_PERMISSIONS: "true"
