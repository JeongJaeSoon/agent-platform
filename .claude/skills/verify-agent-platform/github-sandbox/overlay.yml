# The GitHub sandbox run: up.sh .claude/skills/verify-agent-platform/github-sandbox/overlay.yml
# The source is relative to the project directory (the repo root, where
# compose.yaml is).
services:
  migrate:
    volumes:
      - type: bind
        source: ./.claude/skills/verify-agent-platform/github-sandbox/settings.json
        target: /settings/fake-model.json
        read_only: true
        bind:
          create_host_path: false
  egress-proxy:
    environment:
      EGRESS_CREDENTIAL_ALLOWLIST: api.anthropic.com:443,github.com:443
      # Where GitHub keeps LFS objects; the repository route fetches them there.
      EGRESS_PACKAGES_REDIRECT_ALLOWLIST: github-cloud.githubusercontent.com:443
