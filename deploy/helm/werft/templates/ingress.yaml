{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.hosts }}{{ fail "ingress.hosts needs at least one host" }}{{ end }}
# The public listener only; the authorizer Service is never routed. Only the
# api's public paths (apps/control-host/src/api/app.ts): /internal is the
# workers' gateway, which they reach through the egress proxy.
# /v1 already covers /v1/slack/events and /v1/slack/interactions; they are
# listed on their own so an internet-facing entrance for Slack can copy them.
{{- /*
The web console at "/" is a Prefix that would also match /internal, so a
/internal rule ahead of it answers 404 from the ALB itself
(alb.ingress.kubernetes.io/actions.*). The AWS Load Balancer Controller
ranks a longer Prefix ahead of a shorter one, so /internal wins over "/".
*/}}
{{- $paths := list (list "/v1" "Prefix") (list "/v1/slack/events" "Prefix") (list "/v1/slack/interactions" "Prefix") (list "/docs" "Prefix") (list "/healthz" "Exact") (list "/readyz" "Exact") }}
{{- $blockInternal := "block-internal" }}
{{- $annotations := deepCopy (.Values.ingress.annotations | default dict) }}
{{- if .Values.ingress.console.enabled }}
{{- if ne .Values.ingress.className "alb" }}{{ fail "ingress.console.enabled needs ingress.className alb: other controllers do not answer /internal with the ALB's 404" }}{{ end }}
{{- /* Each of these can send a request past the /internal 404 to the api. */}}
{{- range $key, $_ := $annotations }}
{{- if or (regexMatch "^alb\\.ingress\\.kubernetes\\.io/(actions|conditions|transforms|group)\\." $key) (eq $key "kubernetes.io/ingress.class") }}{{ fail (printf "ingress.annotations must not set %s while ingress.console.enabled: it can route /internal past the ALB's 404" $key) }}{{ end }}
{{- end }}
{{- $paths = append (prepend $paths (list "/internal" "Prefix" $blockInternal)) (list "/" "Prefix") }}
{{- $_ := set $annotations (printf "alb.ingress.kubernetes.io/actions.%s" $blockInternal) (dict "type" "fixed-response" "fixedResponseConfig" (dict "contentType" "text/plain" "statusCode" "404") | toJson) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ap.apiHost" . }}
  labels:
    {{- include "ap.labels" (dict "root" . "component" "api") | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range $paths }}
          - path: {{ index . 0 }}
            pathType: {{ index . 1 }}
            backend:
              service:
                {{- if eq (len .) 3 }}
                name: {{ index . 2 }}
                port:
                  name: use-annotation
                {{- else }}
                name: {{ include "ap.apiHost" $ }}
                port:
                  name: http
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
