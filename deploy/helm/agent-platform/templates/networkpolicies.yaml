{{- if .Values.networkPolicy.enabled }}
{{- $installation := include "ap.installationId" . -}}
# Worker Pods, by the labels the kubernetes execution backend puts on them:
# nothing reaches them, and they reach the egress proxy alone. No DNS (a
# query is a way out too), no other worker, no database, no node or cloud
# metadata address. The backend writes the proxy Service's ClusterIP into
# each Pod's hosts file, so HTTP(S)_PROXY still names the proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ap.fullname" . }}-worker
  labels:
    {{- include "ap.labels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: agent-platform
      app.kubernetes.io/component: worker
      agent-platform.installation: {{ $installation | quote }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "ap.selectorLabels" (dict "root" . "component" "egress-proxy") | nindent 14 }}
      ports:
        - {protocol: TCP, port: 3128}
        - {protocol: TCP, port: 3129}
    {{- if .Values.networkPolicy.worker.allowDirectGateway }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "ap.selectorLabels" (dict "root" . "component" "api") | nindent 14 }}
      ports:
        - {protocol: TCP, port: 3000}
    {{- end }}
---
# The proxy takes connections from workers only; its own egress is open, and
# its allowlists decide what a worker reaches through it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ap.proxyHost" . }}
  labels:
    {{- include "ap.labels" (dict "root" . "component" "egress-proxy") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ap.selectorLabels" (dict "root" . "component" "egress-proxy") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: agent-platform
              app.kubernetes.io/component: worker
              agent-platform.installation: {{ $installation | quote }}
      ports:
        - {protocol: TCP, port: 3128}
        - {protocol: TCP, port: 3129}
---
# 3000 is public (through the Ingress); 3100, the authorizer that hands out
# catalog credentials, answers the egress proxy alone.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ap.apiHost" . }}
  labels:
    {{- include "ap.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ap.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 3000}
      {{- with .Values.networkPolicy.api.ingressFrom }}
      from:
        # Workers' gateway calls arrive through the proxy.
        - podSelector:
            matchLabels:
              {{- include "ap.selectorLabels" (dict "root" $ "component" "egress-proxy") | nindent 14 }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "ap.selectorLabels" (dict "root" . "component" "egress-proxy") | nindent 14 }}
      ports:
        - {protocol: TCP, port: 3100}
---
# The rest serve nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ap.fullname" . }}-no-ingress
  labels:
    {{- include "ap.labels" (dict "root" . "component" "control") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [scheduler, reconciler, slack, migrate, checkpoint-gc]
  policyTypes: [Ingress]
  ingress: []
{{- if .Values.slack.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ap.fullname" . }}-slack-egress
  labels:
    {{- include "ap.labels" (dict "root" . "component" "slack") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ap.selectorLabels" (dict "root" . "component" "slack") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # The Slack Web API.
    - ports:
        - {protocol: TCP, port: 443}
    - ports:
        - {protocol: TCP, port: {{ .Values.networkPolicy.slack.databasePort }}}
{{- end }}
{{- end }}
