{{- $root := . -}}
{{- range $component, $sa := dict "api" .Values.serviceAccounts.api "scheduler" .Values.serviceAccounts.scheduler "worker" dict "workload" dict }}
{{- if or (ne $component "scheduler") $root.Values.scheduler.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ap.fullname" $root }}-{{ $component }}
  labels:
    {{- include "ap.labels" (dict "root" $root "component" $component) | nindent 4 }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Only the scheduler's pods mount a token, and they set that on the pod.
automountServiceAccountToken: false
{{- end }}
{{- end }}
