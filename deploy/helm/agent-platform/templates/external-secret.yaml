{{- if .Values.secrets.externalSecret.enabled }}
{{- $es := .Values.secrets.externalSecret -}}
# A hook ahead of the migrate Job, which reads DATABASE_URL from the Secret
# this writes; the Job's pod waits until the Secret exists. Orphan: the hook is
# recreated on every upgrade, and an owned Secret would be deleted with it.
# Neither goes with `helm uninstall`: delete this ExternalSecret, then the
# Secret, by hand.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "ap.labels" (dict "root" . "component" "secrets") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ required "secrets.externalSecret.secretStoreRef.name is required" $es.secretStoreRef.name }}
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Orphan
  dataFrom:
    - extract:
        key: {{ required "secrets.externalSecret.remoteKey is required" $es.remoteKey }}
{{- end }}
