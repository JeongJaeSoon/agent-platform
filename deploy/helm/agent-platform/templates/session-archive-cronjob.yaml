{{- if .Values.sessionArchive.enabled }}
{{- $days := int .Values.sessionArchive.afterDays }}
{{- if and (ne $days 0) (or (lt $days 30) (gt $days 3650)) }}
{{- fail (printf "sessionArchive.afterDays must be 0 (off) or 30–3650, got %v" .Values.sessionArchive.afterDays) }}
{{- end }}
# One session event archive pass (apps/control-host/src/api/
# session-archive.ts): events of long-idle sessions move into held objects
# under session-archive/. Must not overlap a backup
# (docs/operator/backup-restore.md).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ap.fullname" . }}-session-archive
  labels:
    {{- include "ap.labels" (dict "root" . "component" "session-archive") | nindent 4 }}
spec:
  schedule: {{ .Values.sessionArchive.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "ap.labels" (dict "root" . "component" "session-archive") | nindent 12 }}
        spec:
          restartPolicy: Never
          # The api's: writing and holding archive objects takes the control
          # plane's object store credentials.
          serviceAccountName: {{ include "ap.fullname" . }}-api
          automountServiceAccountToken: false
          securityContext:
            {{- include "ap.podSecurityContext" . | nindent 12 }}
          {{- include "ap.imagePullSecrets" . | nindent 10 }}
          containers:
            - name: session-archive
              image: {{ include "ap.image" (dict "root" . "name" "controlHost") }}
              imagePullPolicy: {{ .Values.images.pullPolicy }}
              args: ["bun", "run", "apps/control-host/src/api/session-archive.ts"]
              env:
                {{- include "ap.secretEnv" (dict "root" . "key" "DATABASE_URL") | nindent 16 }}
                - name: SESSION_ARCHIVE_AFTER_DAYS
                  value: {{ $days | quote }}
                - name: SESSION_ARCHIVE_DRY_RUN
                  value: {{ .Values.sessionArchive.dryRun | quote }}
                - name: LOG_LEVEL
                  value: {{ .Values.config.logLevel | quote }}
                {{- include "ap.checkpointEnv" . | nindent 16 }}
              resources:
                {{- toYaml .Values.sessionArchive.resources | nindent 16 }}
              securityContext:
                {{- include "ap.containerSecurityContext" . | nindent 16 }}
              volumeMounts:
                {{- include "ap.tmpMount" . | nindent 16 }}
          volumes:
            {{- include "ap.tmpVolume" . | nindent 12 }}
          {{- with .Values.sessionArchive.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.sessionArchive.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
