# up.sh's EXTRA_VALUES for preview.sh, laid over the kind and fake-model values.
# One replica each: with the rest these request 1792Mi, which preview.sh's
# PREVIEW_MEMORY_MI (plus one worker below) is counted from.
api:
  replicas: 1
egressProxy:
  replicas: 1
worker:
  # Requests equal limits on worker pods, so the chart's 4608 would reserve
  # 4.5 GiB per session; a fake-model worker used 255 MB in the PoC (94S-958).
  memoryMb: 768
