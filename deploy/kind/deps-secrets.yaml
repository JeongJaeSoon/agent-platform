# Separate from the worker-visible S3 service: local App signing keys stay here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets
  labels: {app: secrets}
spec:
  replicas: 1
  selector:
    matchLabels: {app: secrets}
  template:
    metadata:
      labels: {app: secrets}
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3@sha256:b279c01f4cfb8f985a482e4014cabc1e2697b9d7a6c8c8db2e40f4d9f93687c7
          env:
            - {name: SERVICES, value: secretsmanager}
            - {name: AWS_DEFAULT_REGION, value: ap-northeast-1}
          ports:
            - containerPort: 4566
          readinessProbe:
            exec:
              command: ["sh", "-c", "awslocal secretsmanager describe-secret --secret-id agent-platform/local/fake-messages >/dev/null"]
            periodSeconds: 5
            timeoutSeconds: 10
          volumeMounts:
            - name: init
              mountPath: /etc/localstack/init/ready.d
      volumes:
        - name: init
          configMap:
            name: secrets-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: secrets
spec:
  selector: {app: secrets}
  ports:
    - port: 4566
