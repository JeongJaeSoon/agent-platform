# The fake model for smoke.sh (KIND_MODEL=fake), as infra/compose.local.yml
# runs it under infra/compose.fake-model.yml: the scripted Messages API and
# the api's own Secrets Manager holding its placeholder key. up.sh puts the
# testkit sources and the seed script in ConfigMaps.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-messages
  labels: {app: fake-messages}
spec:
  replicas: 1
  selector:
    matchLabels: {app: fake-messages}
  template:
    metadata:
      labels: {app: fake-messages}
    spec:
      containers:
        - name: fake-messages
          image: oven/bun:1.3.14@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
          command: ["bun", "run", "/app/fake-messages-main.ts"]
          env:
            - {name: FAKE_MESSAGES_PORT, value: "4010"}
          ports:
            - containerPort: 4010
          # /healthz is on the control port; 4010 answers it with a 404.
          readinessProbe:
            httpGet: {path: /healthz, port: 4011}
            periodSeconds: 5
          volumeMounts:
            - name: source
              mountPath: /app
      volumes:
        - name: source
          configMap:
            name: fake-messages-source
---
apiVersion: v1
kind: Service
metadata:
  name: fake-messages
spec:
  selector: {app: fake-messages}
  ports:
    - port: 4010
---
# Apart from the S3 LocalStack on purpose, as in compose: workers reach that
# one through the proxy, and nothing they reach may answer for the key.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets
  labels: {app: secrets}
spec:
  replicas: 1
  selector:
    matchLabels: {app: secrets}
  template:
    metadata:
      labels: {app: secrets}
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3@sha256:b279c01f4cfb8f985a482e4014cabc1e2697b9d7a6c8c8db2e40f4d9f93687c7
          env:
            - {name: SERVICES, value: secretsmanager}
            - {name: AWS_DEFAULT_REGION, value: ap-northeast-1}
          ports:
            - containerPort: 4566
          readinessProbe:
            exec:
              command: ["sh", "-c", "awslocal secretsmanager describe-secret --secret-id agent-platform/local/fake-messages >/dev/null"]
            periodSeconds: 5
            timeoutSeconds: 10
          volumeMounts:
            - name: init
              mountPath: /etc/localstack/init/ready.d
      volumes:
        - name: init
          configMap:
            name: secrets-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: secrets
spec:
  selector: {app: secrets}
  ports:
    - port: 4566
