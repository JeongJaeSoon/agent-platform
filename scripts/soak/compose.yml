# Overlay for the 94S-135 soak and campaigns, applied after
# scripts/d2-gate/compose.yml (ephemeral loopback ports, the gate catalog,
# workers routed through gate-chaos). scripts/soak/stack.sh is the only
# intended caller. What it changes on top of the gate:
# - the Messages API is the soak's (fault injection, bounded summary log);
# - the fault injector keeps a bounded log, since a soak runs for a day;
# - the scheduler loops at the product's interval, so startup timings are
#   the product's and not the gate's faster loop;
# - a VM stall probe runs beside the product (vm-lag below), and an idle
#   twin the runner's host probe calls with it (host-echo below).
services:
  gate-messages:
    command: ["bun", "run", "/app/scripts/soak/messages.ts"]
  gate-chaos:
    environment:
      CHAOS_LOG_MAX: "20000"
  scheduler:
    environment:
      SCHEDULER_INTERVAL_SEC: ${SOAK_SCHEDULER_INTERVAL_SEC:-5}
  # The VM stall probe (94S-443): Docker Desktop's VM stops for 2-3s every
  # 5 minutes (94S-442); soak.ts polls this to tell those stalls apart.
  vm-lag:
    image: oven/bun:1.3.14@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
    command: ["bun", "run", "/app/scripts/soak/vm-lag.ts"]
    volumes:
      - ..:/app:ro
    ports:
      - "127.0.0.1::8098"
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://127.0.0.1:8098/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
  # The host probe's second target (94S-453): vm-lag's script in a container
  # of its own that nothing else calls. A request both it and vm-lag held at
  # once was held by the shared port forward, not by one container.
  host-echo:
    image: oven/bun:1.3.14@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
    command: ["bun", "run", "/app/scripts/soak/vm-lag.ts"]
    volumes:
      - ..:/app:ro
    ports:
      - "127.0.0.1::8098"
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://127.0.0.1:8098/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
