# The format is config/profiles.yaml's.
#
# Opt-in example: config/fake-model plus an operator profile in
# `bypassPermissions`, which runs every tool call with nothing judging it, so
# a workspace profile over it may pick `bypassPermissions` (a workspace
# profile only narrows its base). The API refuses to start on this catalog
# unless the installation sets PLATFORM_ALLOW_UNATTENDED_PERMISSIONS=true;
# infra/compose.fake-model-unattended.yml does both over the fake-model
# overlay. Read docs/operator/api-server.md (자율 모드) before copying this
# profile into a real catalog.
#
# New ids rather than a changed mode on claude-coding-local: the mode is in a
# profile's fingerprint, so editing it in place stops every session and
# release on that id. claude-coding-auto is config/fake-model's.
profiles:
  claude-coding-local:
    runtime_kind: claude_agent_sdk
    runtime_version: "0.3.270"
    model: claude-sonnet-5
    title_model: claude-haiku-4-5
    tools: [Read, Edit, Write, Glob, Grep, Bash, AskUserQuestion]
    permission_mode: default
    provider: &fake-messages
      kind: anthropic
      endpoint: http://fake-messages:4010
      auth:
        kind: api_key
        secret_id: agent-platform/local/fake-messages
    project_settings:
      claude_md: true
  claude-coding-auto:
    runtime_kind: claude_agent_sdk
    runtime_version: "0.3.270"
    model: claude-sonnet-5
    title_model: claude-haiku-4-5
    tools: [Read, Edit, Write, Glob, Grep, Bash, AskUserQuestion]
    permission_mode: auto
    provider: *fake-messages
    project_settings:
      claude_md: true
  claude-coding-bypass:
    runtime_kind: claude_agent_sdk
    runtime_version: "0.3.270"
    model: claude-sonnet-5
    title_model: claude-haiku-4-5
    tools: [Read, Edit, Write, Glob, Grep, Bash, AskUserQuestion]
    permission_mode: bypassPermissions
    provider: *fake-messages
    project_settings:
      claude_md: true
  general:
    runtime_kind: claude_agent_sdk
    runtime_version: "0.3.270"
    model: claude-sonnet-5
    tools: [Read, Write, Edit, Glob, Grep, AskUserQuestion]
    permission_mode: default
    provider: *fake-messages
    repository: none
