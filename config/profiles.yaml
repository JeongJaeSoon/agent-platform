# The installation ceilings an empty database starts with. The API reads
# this file from PLATFORM_CONFIG_DIR (default: this directory) only while
# installation_profiles has no row, and writes these entries in; once the
# table holds a row the file is never read again, and ceilings change in
# the console or through POST /v1/installation-profiles. An invalid profile
# here stops a first start.
#
# Each provider block must equal a connection in connections.yaml, or the
# ceiling seeded from it does not run.
#
# A profile never holds a credential value. `provider.auth` names where the
# API reads it at startup — exactly one of:
#   value_env: an environment variable of the API process
#   secret_id: a Secrets Manager secret (AWS_ENDPOINT_URL_SECRETS_MANAGER
#              points at the local `secrets` LocalStack under compose)
# Each profile's fingerprint (sha256 over these settings and the reference,
# never the value) rides every worker claim; rotating the value behind the
# same reference keeps it. A session is held to the fingerprint of its
# profile: change a setting under a new id, since editing one in place
# stops every session on it (CATALOG_MISMATCH). A session moves to another
# id of the same runtime and billing with POST /v1/sessions/{id}/profile.
#
# `models` (optional) lists other models a session may name with `model`
# on POST /v1/sessions; `model` stays the default. A session is pinned to
# the profile as its model made it, so adding a model stops nothing, and
# taking a session's model off the list stops that session.
#
# `provider.billing: none` marks an endpoint that does not bill per token (a
# model served on your own hardware): its sessions are recorded at no cost
# and run with no dollar limit. Only a private address or a name public DNS
# does not serve is accepted; that the endpoint really is unbilled is yours
# to make sure of (docs/operator/configuration.md).
#
# The example below is the real Messages API with the caller's
# ANTHROPIC_API_KEY, which the local stack hands to the API alone
# (docs/real-claude.md); without it the API does not start. Workers only
# ever hold an egress token for it. config/fake-model is the catalog for
# running without a key (infra/compose.fake-model.yml).
profiles:
  claude-coding-real:
    runtime_kind: claude_agent_sdk
    runtime_version: "0.3.270"
    model: claude-sonnet-5
    tools: [Read, Edit, Write, Glob, Grep, Bash, AskUserQuestion]
    permission_mode: default
    provider:
      kind: anthropic
      endpoint: https://api.anthropic.com
      auth:
        kind: api_key
        value_env: ANTHROPIC_API_KEY
    project_settings:
      claude_md: true
  # claude-coding-real with a model classifier answering in place of a
  # person, so a workspace profile over it may run `auto` (it only narrows its
  # base). A new id: the mode is in a profile's fingerprint, so changing it on
  # claude-coding-real would stop every session and release on that id.
  # `bypassPermissions` needs PLATFORM_ALLOW_UNATTENDED_PERMISSIONS=true
  # (docs/operator/api-server.md, 자율 모드).
  claude-coding-real-auto:
    runtime_kind: claude_agent_sdk
    runtime_version: "0.3.270"
    model: claude-sonnet-5
    tools: [Read, Edit, Write, Glob, Grep, Bash, AskUserQuestion]
    permission_mode: auto
    provider:
      kind: anthropic
      endpoint: https://api.anthropic.com
      auth:
        kind: api_key
        value_env: ANTHROPIC_API_KEY
    project_settings:
      claude_md: true
