# Repositories sessions may run against. A session names one by
# id; the worker is handed the URL and branch registered here at claim time.
#
# `profiles` (optional) is a seed: the profiles.yaml ceilings that may run
# against this repository when they are first written to the database. The
# database's repository_ids is the allowlist after that, edited as a new
# ceiling version in the console; changing this list later changes nothing.
# A create naming a pair the database does not allow answers 422. A session
# whose id now points at another URL or branch is failed with
# CATALOG_MISMATCH at its next launch (docs/operator/api-server.md).
#
# URLs must be http:// or https:// (a worker's only way out is the HTTP(S)
# egress proxy) and must not carry a credential (no userinfo, no query
# string).
#
# A private repository names its login under `auth`, by reference like a
# profile's provider key (value_env or secret_id, exactly one). The worker
# never receives it: it clones through the egress proxy's
# repository route with a token scoped to its attempt, and the proxy adds
# this login on the way out. Read access is all the route serves; nothing is
# ever pushed through it.
#
#   auth:
#     kind: basic            # or bearer, which takes no username
#     username: agent
#     value_env: SAMPLE_APP_GIT_PASSWORD
#
# A GitHub repository (github.com, or a GHES host in its place) takes a
# fine-grained PAT as the password of the login x-access-token: Contents
# read-only to clone, Contents read and write to push approved sessions, and
# Pull requests read and write as well to open pull requests from them (a
# GitHub App, kind github_app, is the default; docs/operator/api-server.md). Write the https clone URL ending in .git, and put
# github.com:443 on EGRESS_CREDENTIAL_ALLOWLIST, never on EGRESS_ALLOWLIST
# (docs/operator/api-server.md, GitHub 저장소).
#
#   app:
#     url: https://github.com/<owner>/<repo>.git
#     branch: main
#     profiles: [claude-coding-real]
#     auth:
#       kind: basic
#       username: x-access-token
#       value_env: APP_GITHUB_PAT   # or secret_id
#
# The GitHub App registered in the console (Settings, Workspace, GitHub)
# takes only its kind; the API finds the installation that covers the
# repository. An entry with app_id, installation_id and a key reference
# keeps using those instead.
#
#   app:
#     url: https://github.com/<owner>/<repo>.git
#     branch: main
#     profiles: [claude-coding-real]
#     auth:
#       kind: github_app
#
# The entry below is the compose Gitea; its gitea-init service creates the
# repository (infra/gitea/init-sample-repo.sh).
repositories:
  sample-app:
    url: http://gitea:3000/agent/sample-app.git
    branch: main
    profiles: [claude-coding-real, claude-coding-real-auto]
