# Repositories sessions may run against (94S-132). A session names one by
# id; the worker is handed the URL and branch registered here at claim time.
#
# `profiles` is the allowlist of profiles that may run against this
# repository: the (profile, repository) pair is the unit of trust. A create
# naming a pair not listed answers 422. A session whose pair has since been
# removed, or whose id now points at another URL or branch, is failed with
# CATALOG_MISMATCH at its next launch; restoring the pair lets the next
# message run it again, and nothing reruns on its own (README, 94S-280).
#
# URLs must be http:// or https:// (a worker's only way out is the HTTP(S)
# egress proxy) and must not carry a credential (no userinfo, no query
# string).
#
# A private repository names its login under `auth`, by reference like a
# profile's provider key (value_env or secret_id, exactly one). The worker
# never receives it (94S-252): it clones through the egress proxy's
# repository route with a token scoped to its attempt, and the proxy adds
# this login on the way out. Read access is all the route serves; nothing is
# ever pushed through it.
#
#   auth:
#     kind: basic            # or bearer, which takes no username
#     username: agent
#     value_env: SAMPLE_APP_GIT_PASSWORD
#
# The example is the compose Gitea. Creating the sample repository in it is
# not automated yet (94S-52).
repositories:
  sample-app:
    url: http://gitea:3000/agent/sample-app.git
    branch: main
    profiles: [claude-coding-local]
